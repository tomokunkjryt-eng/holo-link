*{

}

  margin:0;  
  background:#f4f6fa;  
  color:#222;  
  font-family:  
    Arial,  
    "Noto Sans JP",  
    sans-serif;  
}  
  
header{  
  position:sticky;  
  top:0;  
  z-index:50;  
  background:rgba(255,255,255,.97);  
  padding:15px 12px;  
  text-align:center;  
  box-shadow:0 2px 12px #ccc;  
}  
  
h1{  
  margin:0 0 13px;  
  font-size:24px;  
}  
  
/* =========================  
   検索＋フィルター  
========================= */  
  
.controls{  
  max-width:700px;  
  margin:auto;  
  display:flex;  
  gap:8px;  
  align-items:center;  
}  
  
#search{  
  flex:1;  
  min-width:0;  
  padding:11px 13px;  
  border:1px solid #ccc;  
  border-radius:11px;  
  font-size:14px;  
  outline:none;  
}  
  
#search:focus{  
  border-color:#1683ff;  
}  
  
.filter-wrap{  
  position:relative;  
}  
  
#filterButton{  
  width:110px;  
  padding:11px 8px;  
  border:1px solid #ccc;  
  border-radius:11px;  
  background:white;  
  font-size:13px;  
  cursor:pointer;  
  white-space:nowrap;  
}  
  
#filterButton:active{  
  transform:scale(.97);  
}  
  
#filterArea{  
  display:none;  
  position:absolute;  
  right:0;  
  top:calc(100% + 7px);  
  width:220px;  
  max-height:420px;  
  overflow-y:auto;  
  padding:8px;  
  background:white;  
  border-radius:13px;  
  box-shadow:0 5px 20px rgba(0,0,0,.2);  
  z-index:100;  
}  
  
#filterArea.show{  
  display:block;  
}  
  
.filter-grid{  
  display:flex;  
  flex-direction:column;  
  gap:5px;  
}  
  
.filter{  
  width:100%;  
  padding:9px;  
  border:1px solid #ddd;  
  border-radius:9px;  
  background:white;  
  text-align:left;  
  cursor:pointer;  
  font-size:13px;  
}  
  
.filter.active{  
  background:#1683ff;  
  color:white;  
  border-color:#1683ff;  
}  
  
#status{  
  margin-top:9px;  
  font-size:12px;  
  color:#666;  
}  
  
/* =========================  
   メンバー  
========================= */  
  
#members{  
  max-width:1250px;  
  margin:20px auto;  
  padding:0 12px 40px;  
  
  display:grid;  
  
  grid-template-columns:  
    repeat(auto-fill,minmax(190px,1fr));  
  
  gap:15px;  
}  
  
.card{  
  background:white;  
  border-radius:17px;  
  padding:12px;  
  text-align:center;  
  
  box-shadow:0 3px 12px #ddd;  
  
  transition:.15s;  
  
  border:4px solid transparent;  
  
  cursor:pointer;  
}  
  
.card:active{  
  transform:scale(.98);  
}  
  
.card.live{  
  border-color:#ff2222;  
}  
  
.card.upcoming{  
  border-color:#1683ff;  
}  
  
.card.live.upcoming{  
  border-color:#ff2222;  
  
  box-shadow:  
    0 0 0 3px #1683ff,  
    0 3px 12px #ddd;  
}  
  
.hidden{  
  display:none!important;  
}  
  
.profile-button{  
  display:block;  
  
  width:120px;  
  height:120px;  
  
  margin:auto;  
  
  border:0;  
  padding:0;  
  
  border-radius:50%;  
  
  background:none;  
  
  position:relative;  
}  
  
.avatar{  
  width:120px;  
  height:120px;  
  
  border-radius:50%;  
  
  object-fit:cover;  
  
  border:4px solid transparent;  
  
  background:#eee;  
}  
  
.avatar.live{  
  border-color:#ff2222;  
}  
  
.avatar.upcoming{  
  border-color:#1683ff;  
}  
  
.status-badge{  
  position:absolute;  
  
  left:50%;  
  bottom:-3px;  
  
  transform:translateX(-50%);  
  
  padding:3px 8px;  
  
  border-radius:999px;  
  
  color:white;  
  
  font-size:10px;  
  font-weight:bold;  
  
  white-space:nowrap;  
}  
  
.status-badge.live{  
  background:#f22;  
}  
  
.status-badge.upcoming{  
  background:#1683ff;  
}  
  
.name{  
  margin-top:10px;  
  font-size:16px;  
  font-weight:bold;  
}  
  
.group{  
  margin-top:3px;  
  font-size:12px;  
  color:#666;  
}  
  
.date{  
  margin-top:4px;  
  font-size:11px;  
  color:#999;  
}  
  
.socials{  
  display:flex;  
  justify-content:center;  
  gap:9px;  
  margin-top:11px;  
}  
  
.social{  
  width:40px;  
  height:40px;  
  
  border-radius:50%;  
  
  overflow:hidden;  
  
  background:#eee;  
  
  display:block;  
}  
  
.social img{  
  width:100%;  
  height:100%;  
  object-fit:cover;  
}  
  
.live-mini{  
  margin-top:8px;  
  font-size:10px;  
  color:#f22;  
  font-weight:bold;  
}  
  
.upcoming-mini{  
  margin-top:4px;  
  font-size:10px;  
  color:#1683ff;  
  font-weight:bold;  
}  
  
/* =========================  
   最新楽曲ボタン  
========================= */  
  
.song-button{  
  display:block;  
  
  width:100%;  
  
  margin-top:9px;  
  
  padding:9px 7px;  
  
  border-radius:9px;  
  
  background:#f0f2f5;  
  
  color:#333;

  font-size:11px;

}  
  
.song-button:hover{

}  
  
.song-button.waiting{  
  color:#777;  
  cursor:default;  
}  
  
/* =========================  
   モーダル  
========================= */  
  
#modalBg{

  inset:0;  
  
  z-index:100;

  padding:15px;  
  
  overflow:auto;  
}  
  
#modalBg.show{  
  display:flex;  
  
  align-items:center;  
  justify-content:center;  
}  
  
#modal{  
  width:min(600px,100%);  
  
  max-height:92vh;  
  
  overflow:auto;  
  
  background:white;  
  
  border-radius:20px;

  height:38px;

  height:110px;

  font-size:21px;

}  
  
#modalGroup{

.section{

  padding:13px;  
  
  background:#f4f5f7;

.section-title{

  background:white;  
  
  border-radius:11px;  
  
  overflow:hidden;

}

  /* =====================================================
   ドットホロメン
===================================================== */


#dotHoloWorld{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  overflow:hidden;
}


.dotHolo{
  position:absolute;


  width:40px;
  height:40px;


  object-fit:contain;


  image-rendering:pixelated;


  user-select:none;
  -webkit-user-drag:none;


  pointer-events:none;


  will-change:transform,left,top;


  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
}


.dotHolo.walk{
  animation:dotWalk .55s steps(2) infinite;
}


.dotHolo.idle{
  animation:dotIdle 1.8s steps(2) infinite;
}


.dotHolo.sit{
  animation:dotSit 2s steps(2) infinite;
}


.dotHolo.cry{
  animation:dotCry .45s steps(2) infinite;
}


.dotHolo.eat{
  animation:dotEat .65s steps(2) infinite;
}


.dotHolo.sleep{
  animation:dotSleep 2.2s steps(2) infinite;
}


@keyframes dotWalk{
  0%{
    margin-top:0;
    transform:rotate(-2deg);
  }


  50%{
    margin-top:-3px;
    transform:rotate(2deg);
  }


  100%{
    margin-top:0;
    transform:rotate(-2deg);
  }
}


@keyframes dotIdle{
  0%,100%{
    transform:translateY(0);
  }


  50%{
    transform:translateY(-1px);
  }
}


@keyframes dotSit{
  0%,100%{
    transform:translateY(4px) scaleY(.82);
  }


  50%{
    transform:translateY(5px) scaleY(.80);
  }
}


@keyframes dotCry{
  0%,100%{
    transform:translateX(0);
  }


  25%{
    transform:translateX(-2px);
  }


  75%{
    transform:translateX(2px);
  }
}


@keyframes dotEat{
  0%,100%{
    transform:translateY(0);
  }


  50%{
    transform:translateY(-2px);
  }
}


@keyframes dotSleep{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }


  50%{
    transform:translateY(2px) rotate(2deg);
  }
}


.dotFood{
  position:absolute;


  width:14px;
  height:14px;


  image-rendering:pixelated;


  pointer-events:none;


  z-index:2;
}


.dotTears{
  position:absolute;


  font-size:12px;


  pointer-events:none;


  animation:dotTear .7s steps(2) infinite;
}


@keyframes dotTear{
  0%{
    transform:translateY(0);
    opacity:1;
  }


  100%{
    transform:translateY(7px);
    opacity:.2;
  }
}


.dotSleepMark{
  position:absolute;


  font-size:12px;
  font-weight:bold;


  color:#777;


  pointer-events:none;


  animation:dotZzz 1.5s steps(3) infinite;
}


@keyframes dotZzz{
  0%{
    transform:translate(0,4px);
    opacity:.2;
  }


  50%{
    transform:translate(3px,-2px);
    opacity:1;
  }


  100%{
    transform:translate(6px,-8px);
    opacity:0;
  }
}



@media(max-width:600px){

  }

  }

  }

function localImage(m){  
  
  return "images/"+m.image;  
  
}  
  
  
function setImage(img,url){  
  
  img.onerror=function(){  
  
    img.onerror=null;  
  
    img.src=fallbackAvatar;  
  
  };  
  
  img.src=url;  
  
}

function createCard(m,index){  
  
  const card=  
  document.createElement("article");  
  
  card.className="card";  
  
  card.dataset.index=index;  
  
  card.dataset.name=  
    m.name.toLowerCase();  
  
  card.dataset.groups=  
    m.groups.join("|");  
  
  
  card.addEventListener(  
    "click",  
    function(e){  
  
      if(  
        e.target.closest(".social") ||  
        e.target.closest(".song-button")  
      ){  
  
        return;  
  
      }  
  
      openMember(index);  
  
    }  
  );  
  
  
  const profile=  
  document.createElement("div");  
  
  profile.className=  
    "profile-button";  
  
  
  const avatar=  
  document.createElement("img");  
  
  avatar.className="avatar";  
  
  avatar.id=  
    "avatar-"+index;  
  
  avatar.alt=  
    m.name;  
  
  setImage(  
    avatar,  
    localImage(m)  
  );  
  
  
  const badge=  
  document.createElement("span");  
  
  badge.className=  
    "status-badge";  
  
  badge.id=  
    "badge-"+index;  
  
  
  profile.appendChild(avatar);  
  profile.appendChild(badge);  
  
  
  const name=  
  document.createElement("div");  
  
  name.className="name";  
  
  name.textContent=  
    m.name;  
  
  
  const group=  
  document.createElement("div");  
  
  group.className="group";  
  
  group.textContent=  
    m.groups.join("　");  
  
  
  const date=  
  document.createElement("div");  
  
  date.className="date";  
  
  date.textContent=  
    "デビュー："+m.date;  
  
  
  const socials=  
  document.createElement("div");  
  
  socials.className="socials";  
  
  
  const yt=  
  document.createElement("a");  
  
  yt.className="social";  
  
  yt.href=  
    m.youtubeURL;  
  
  yt.target="_blank";  
  
  yt.rel="noopener";  
  
  
  const ytImg=  
  document.createElement("img");  
  
  ytImg.alt="YouTube";  
  
  setImage(  
    ytImg,  
    localImage(m)  
  );  
  
  yt.appendChild(ytImg);  
  
  
  const x=  
  document.createElement("a");  
  
  x.className="social";  
  
  x.href=  
    m.xURL;  
  
  x.target="_blank";  
  
  x.rel="noopener";  
  
  
  const xImg=  
  document.createElement("img");  
  
  xImg.alt="X";  
  
  setImage(  
    xImg,

  x.appendChild(xImg);  
  
  
  socials.appendChild(yt);  
  socials.appendChild(x);  
  
  
  const song=  
  document.createElement("a");  
  
  song.className="song-button";  
  
  song.id=  
    "song-"+index;

    "🎵 最新の楽曲を読み込み中…";

    "click",

}

/* =====================================================  
   フィルター  
===================================================== */  
  
let selectedGroup="all";  
  
  
function applyFilter(){  
  
  const query=  
    searchBox.value  
    .trim()  
    .toLowerCase();  
  
  
  document  
  .querySelectorAll(".card")  
  .forEach(function(card){  
  
    const name=  
      card.dataset.name;  
  
  
    const groups=  
      card.dataset.groups.split("|");  
  
  
    const nameOK=  
      name.includes(query);  
  
  
    const groupOK=  
      selectedGroup==="all" ||  
      groups.includes(selectedGroup);  
  
  
    card.classList.toggle(  
      "hidden",  
      !(nameOK && groupOK)  
    );  
  
  });  
  
}  
  
  
searchBox.addEventListener(  
  "input",  
  applyFilter  
);

  フィルターボタン  
*/  
  
filterButton.addEventListener(  
  "click",  
  function(e){  
  
    e.stopPropagation();  
  
    filterArea.classList.toggle(  
      "show"  
    );  
  
  }  
);  
  
  
/*  
  フィルター選択  
*/  
  
document  
.querySelectorAll(".filter")  
.forEach(function(button){  
  
  button.addEventListener(  
    "click",  
    function(e){  
  
      e.stopPropagation();  
  
      selectedGroup=  
        button.dataset.group;  
  
  
      document  
      .querySelectorAll(".filter")  
      .forEach(function(x){  
  
        x.classList.remove(  
          "active"  
        );  
  
      });  
  
  
      button.classList.add(  
        "active"  
      );  
  
  
      filterButton.textContent=  
        selectedGroup==="all"  
        ?  
        "📂 フィルター"  
        :  
        "📂 "+selectedGroup;  
  
  
      filterArea.classList.remove(  
        "show"  
      );  
  
  
      applyFilter();  
  
    }  
  );  
  
});

/* =====================================================  
   時間  
===================================================== */  
  
function formatDateTime(value){  
  
  if(!value){  
    return "";  
  }  
  
  const d=  
    new Date(value);  
  
  if(  
    Number.isNaN(d.getTime())  
  ){  
    return "";  
  }  
  
  return d.toLocaleString(  
    "ja-JP",  
    {  
      month:"numeric",  
      day:"numeric",  
      hour:"2-digit",  
      minute:"2-digit"  
    }  
  );  
  
}  
  
  
function relativeTime(value){  
  
  if(!value){  
    return "";  
  }  
  
  const t=  
    new Date(value).getTime();  
  
  if(Number.isNaN(t)){  
    return "";  
  }  
  
  const diff=  
    Date.now()-t;  
  
  
  /*  
    未来  
  */  
  
  if(diff<0){  
  
    const minutes=  
      Math.floor(  
        (-diff)/60000  
      );  
  
  
    if(minutes<1){  
      return "まもなく開始";  
    }  
  
  
    if(minutes<60){  
  
      return(  
        minutes+  
        "分後に開始"  
      );  
  
    }  
  
  
    const hours=  
      Math.floor(  
        minutes/60  
      );  
  
    const min=  
      minutes%60;  
  
  
    if(min===0){  
  
      return(  
        hours+  
        "時間後に開始"  
      );  
  
    }  
  
  
    return(  
      hours+  
      "時間"+  
      min+  
      "分後に開始"  
    );  
  
  }  
  
  
  /*  
    過去  
  */  
  
  const minutes=  
    Math.floor(  
      diff/60000  
    );  
  
  
  if(minutes<1){  
    return "開始したばかり";  
  }  
  
  
  if(minutes<60){  
  
    return(  
      minutes+  
      "分前に開始"  
    );  
  
  }  
  
  
  const hours=  
    Math.floor(  
      minutes/60  
    );  
  
  
  if(hours<24){  
  
    const min=  
      minutes%60;  
  
    if(min===0){  
  
      return(  
        hours+  
        "時間前に開始"  
      );  
  
    }  
  
    return(  
      hours+  
      "時間"+  
      min+  
      "分前に開始"  
    );  
  
  }  
  
  
  return(  
    Math.floor(hours/24)+  
    "日前に開始"  
  );  
  
}  
  
  
/* =====================================================  
   Workerデータ正規化  
===================================================== */  
  
function normalizeMemberData(raw){  
  
  if(!raw){  
    return null;  
  }  
  
  
  const result={};  
  
  
  result.channelId=  
    raw.channelId ||  
    raw.channelID ||  
    raw.id ||  
    null;  
  
  
  result.avatar=  
    raw.avatar ||  
    raw.profileImage ||  
    raw.profileImageUrl ||  
    raw.thumbnail ||  
    raw.channelAvatar ||  
    raw.channelThumbnail ||  
    null;  
  
  
  result.isLive=  
    raw.isLive===true ||  
    raw.live===true ||  
    raw.liveStatus==="live" ||  
    raw.status==="live";  
  
  
  result.isUpcoming=  
    raw.isUpcoming===true ||  
    raw.upcoming===true ||  
    raw.liveStatus==="upcoming" ||  
    raw.status==="upcoming";  
  
  
  result.liveURL=  
    raw.liveURL ||  
    raw.liveUrl ||  
    raw.live_url ||  
    raw.liveVideoURL ||  
    raw.liveVideoUrl ||  
    null;  
  
  
  result.upcomingURL=  
    raw.upcomingURL ||  
    raw.upcomingUrl ||  
    raw.upcoming_url ||  
    raw.upcomingVideoURL ||  
    raw.upcomingVideoUrl ||  
    null;  
  
  
  result.liveTitle=  
    raw.liveTitle ||  
    raw.liveName ||  
    raw.liveVideoTitle ||  
    null;  
  
  
  result.upcomingTitle=  
    raw.upcomingTitle ||  
    raw.upcomingName ||  
    raw.upcomingVideoTitle ||  
    null;  
  
  
  result.liveStartTime=  
    raw.liveStartTime ||  
    raw.liveStartedAt ||  
    raw.liveStart ||  
    raw.liveScheduledStartTime ||  
    null;  
  
  
  result.upcomingStartTime=  
    raw.upcomingStartTime ||  
    raw.upcomingStartedAt ||  
    raw.upcomingStart ||  
    raw.upcomingScheduledStartTime ||  
    null;  
  
  
  result.liveThumb=  
    raw.liveThumb ||  
    raw.liveThumbnail ||  
    raw.liveThumbnailURL ||  
    null;  
  
  
  result.upcomingThumb=  
    raw.upcomingThumb ||  
    raw.upcomingThumbnail ||  
    raw.upcomingThumbnailURL ||  
    null;  
  
  
  /* =========================  
     最新動画  
  ========================= */  
  
  let latest=  
    raw.latest;  
  
  if(!Array.isArray(latest)){  
    latest=raw.latestVideos;  
  }  
  
  if(!Array.isArray(latest)){  
    latest=raw.videos;  
  }  
  
  if(!Array.isArray(latest)){  
    latest=raw.latestVideo;  
    if(latest) latest=[latest];  
  }  
  
  if(!Array.isArray(latest)){  
    latest=[];  
  }  
  
  
  result.latest=  
    latest  
    .map(function(video){  
  
      if(!video){  
        return null;  
      }  
  
  
      const id=  
        video.id ||  
        video.videoId ||  
        video.video_id ||  
        null;  
  
  
      const url=  
        video.url ||  
        video.videoURL ||  
        video.videoUrl ||  
        (  
          id  
          ?  
          "https://www.youtube.com/watch?v="+id  
          :  
          null  
        );  
  
  
      const title=  
        video.title ||  
        video.name ||  
        "YouTube動画";  
  
  
      const thumb=  
        video.thumb ||  
        video.thumbnail ||  
        video.thumbnailURL ||  
        (  
          id  
          ?  
          "https://i.ytimg.com/vi/"+id+  
          "/hqdefault.jpg"  
          :  
          null  
        );  
  
  
      const publishedAt=  
        video.publishedAt ||  
        video.publishDate ||  
        video.published ||  
        video.date ||  
        null;  
  
  
      return{  
        id:id,  
        url:url,  
        title:title,  
        thumb:thumb,  
        publishedAt:publishedAt  
      };  
  
    })  
    .filter(function(video){  
  
      return(  
        video &&  
        video.url  
      );  
  
    });  
  
  
  result.latest.sort(  
    function(a,b){  
  
      const ta=  
        new Date(  
          a.publishedAt || 0  
        ).getTime();  
  
      const tb=  
        new Date(  
          b.publishedAt || 0  
        ).getTime();  
  
      return tb-ta;  
  
    }  
  );  
  
  
  result.latest=  
    result.latest.slice(0,2);  
  
  
  /* =========================  
     最新楽曲  
  ========================= */  
  
  const song=  
    raw.latestSong ||  
    raw.latestMusic ||  
    raw.latestSongVideo ||  
    raw.latestMusicVideo ||  
    raw.song ||  
    raw.music ||  
    null;  
  
  
  if(song){  
  
    if(typeof song==="string"){  
  
      result.latestSong={  
        url:song  
      };  
  
    }  
    else{  
  
      const id=  
        song.id ||  
        song.videoId ||  
        song.video_id ||  
        null;  
  
  
      result.latestSong={  
        id:id,  
  
        url:  
          song.url ||  
          song.videoURL ||  
          song.videoUrl ||  
          (  
            id  
            ?  
            "https://www.youtube.com/watch?v="+id  
            :  
            null  
          ),  
  
        title:  
          song.title ||  
          song.name ||  
          "最新の楽曲"  
      };  
  
    }  
  
  }  
  else{  
  
    result.latestSong=null;  
  
  }  
  
  
  return result;  
  
}  
  
  
/* =====================================================  
   カード状態  
===================================================== */  
  
function updateCard(m,index){  
  
  const card=  
    document.querySelector(  
      '.card[data-index="'+index+'"]'  
    );  
  
  if(!card){  
    return;  
  }  
  
  
  const avatar=  
    document.getElementById(  
      "avatar-"+index  
    );  
  
  const badge=  
    document.getElementById(  
      "badge-"+index  
    );  
  
  const liveMini=  
    document.getElementById(  
      "live-mini-"+index  
    );  
  
  const upcomingMini=  
    document.getElementById(  
      "upcoming-mini-"+index  
    );  
  
  
  card.classList.remove(  
    "live",  
    "upcoming"  
  );  
  
  
  avatar.classList.remove(  
    "live",  
    "upcoming"  
  );  
  
  
  badge.className=  
    "status-badge";  
  
  badge.textContent="";  
  
  
  liveMini.textContent="";  
  
  upcomingMini.textContent="";  
  
  
  /*  
    LIVE  
  */  
  
  if(m.info.isLive){  
  
    card.classList.add("live");  
  
    avatar.classList.add("live");  
  
    badge.classList.add("live");  
  
    badge.textContent="LIVE";  
  
  
    liveMini.textContent=  
      "🔴 "+  
      (  
        relativeTime(  
          m.info.liveStartTime  
        ) ||  
        "LIVE配信中"  
      );  
  
  }  
  
  
  /*  
    待機  
  */  
  
  if(m.info.isUpcoming){  
  
    card.classList.add("upcoming");  
  
    upcomingMini.textContent=  
      "🔵 "+  
      (  
        relativeTime(  
          m.info.upcomingStartTime  
        ) ||  
        "ライブ待機中"  
      );  
  
  }  
  
  
  /*  
    LIVE＋待機  
    赤を内側  
    青を外側  
  */  
  
  if(  
    m.info.isLive &&  
    m.info.isUpcoming  
  ){  
  
    card.classList.add(  
      "live",  
      "upcoming"  
    );  
  
    avatar.classList.add("live");  
  
    avatar.classList.remove(  
      "upcoming"  
    );  
  
    badge.className=  
      "status-badge live";  
  
    badge.textContent=  
      "LIVE";  
  
  }  
  else if(  
    m.info.isUpcoming  
  ){  
  
    avatar.classList.add(  
      "upcoming"  
    );  
  
    badge.className=  
      "status-badge upcoming";  
  
    badge.textContent=  
      "待機中";  
  
  }  
  
  
  /*  
    最新楽曲  
  */  
  
  updateSongButton(m,index);  
  
}  
  
  
/* =====================================================  
   最新楽曲ボタン  
===================================================== */  
  
function updateSongButton(m,index){  
  
  const button=  
    document.getElementById(  
      "song-"+index  
    );  
  
  if(!button){  
    return;  
  }  
  
  
  const song=  
    m.info.latestSong;  
  
  
  if(  
    song &&  
    song.url  
  ){  
  
    button.className=  
      "song-button";  
  
    button.href=  
      song.url;  
  
    button.target="_blank";  
  
    button.rel="noopener";  
  
    button.textContent=  
      "🎵 最新の楽曲";  
  
  }  
  else{  
  
    button.className=  
      "song-button waiting";  
  
    button.removeAttribute("href");  
  
    button.removeAttribute("target");  
  
    button.removeAttribute("rel");  
  
    button.textContent=  
      "🎵 最新の楽曲がでるまで楽曲をお待ちください";  
  
  }  
  
}  
  
  
/* =====================================================  
   Worker取得  
===================================================== */  
  
async function refreshFromWorker(){  
  
  statusBox.textContent=  
    "YouTube情報を取得中…";  
  
  
  try{  
  
    const handles=  
      members.map(function(m){  
        return m.youtube;  
      });  
  
  
    const url=  
      WORKER_URL+  
      "?handles="+  
      encodeURIComponent(  
        handles.join(",")  
      );  
  
  
    const response=  
      await fetch(  
        url,  
        {  
          method:"GET",  
          cache:"no-store"  
        }  
      );  
  
  
    if(!response.ok){  
  
      throw new Error(  
        "Worker HTTP "+  
        response.status  
      );  
  
    }  
  
  
    const data=  
      await response.json();  
  
  
    /*  
      Workerの返却形式を  
      できるだけ柔軟に処理  
    */  
  
    let workerMembers=  
      data.members ||  
      data.data ||  
      data.result ||  
      data.channels ||  
      data;  
  
  
    /*  
      配列の場合  
    */  
  
    if(Array.isArray(workerMembers)){  
  
      const converted={};  
  
  
      workerMembers.forEach(  
        function(item){  
  
          if(!item){  
            return;  
          }  
  
  
          const key=  
            item.youtube ||  
            item.handle ||  
            item.channel ||  
            item.channelHandle ||  
            item.youtubeHandle;  
  
  
          if(key){  
  
            converted[key]=item;  
  
          }  
  
        }  
      );  
  
  
      workerMembers=  
        converted;  
  
    }  
  
  
    /*  
      各メンバー  
    */  
  
    members.forEach(  
      function(m,index){  
  
        let raw=null;  
  
  
        /*  
          普通のhandle  
        */  
  
        if(  
          workerMembers &&  
          typeof workerMembers==="object"  
        ){  
  
          raw=  
            workerMembers[m.youtube];  
  
        }  
  
  
        /*  
          大文字小文字無視  
        */  
  
        if(!raw){  
  
          const key=  
            Object.keys(  
              workerMembers || {}  
            )  
            .find(function(k){  
  
              return(  
                k.toLowerCase()===  
                m.youtube.toLowerCase()  
              );  
  
            });  
  
  
          if(key){  
  
            raw=  
              workerMembers[key];  
  
          }  
  
        }  
  
  
        /*  
          配列以外の特殊形式  
        */  
  
        if(  
          !raw &&  
          data[m.youtube]  
        ){  
  
          raw=  
            data[m.youtube];  
  
        }  
  
  
        if(!raw){  
          return;  
        }  
  
  
        const info=  
          normalizeMemberData(raw);  
  
  
        if(info){  
  
          /*  
            Workerの情報だけ更新。  
            メイン画像はlocal imagesを維持。  
          */  
  
          m.info=info;  
  
        }  
  
  
        updateCard(  
          m,  
          index  
        );  
  
      }  
    );  
  
  
    applyFilter();  
  
  
    statusBox.textContent=  
      members.length+  
      "人のYouTube情報を取得しました";  
  
  
  }  
  catch(error){  
  
    console.error(  
      "Worker Error:",  
      error  
    );  
  
  
    statusBox.textContent=  
      "YouTube情報を取得できませんでした";  
  
  
    members.forEach(  
      function(m,index){  
  
        updateCard(  
          m,  
          index  
        );  
  
      }  
    );  
  
  }  
  
}

/* =====================================================  
   動画カード  
===================================================== */  
  
function createVideo(video){  
  
  const a=  
    document.createElement("a");  
  
  a.className="video";  
  
  a.href=  
    video.url;  
  
  a.target="_blank";  
  
  a.rel="noopener";  
  
  
  if(video.thumb){  
  
    const img=  
      document.createElement("img");  
  
    img.src=  
      video.thumb;  
  
    img.alt="";  
  
    img.onerror=  
      function(){  
  
        img.style.display=  
          "none";  
  
      };  
  
  
    a.appendChild(img);  
  
  }  
  
  
  const text=  
    document.createElement("div");  
  
  text.className=  
    "video-text";  
  
  
  const title=  
    document.createElement("div");  
  
  title.textContent=  
    video.title;  
  
  
  const time=  
    document.createElement("div");  
  
  time.className=  
    "video-time";  
  
  
  time.textContent=  
    video.publishedAt  
    ?  
    formatDateTime(  
      video.publishedAt  
    )  
    :  
    "";  
  
  
  text.appendChild(title);  
  text.appendChild(time);  
  
  a.appendChild(text);  
  
  
  return a;  
  
}  
  
  
/* =====================================================  
   LIVE / 待機  
===================================================== */  
  
function createLiveLink(  
  title,  
  url,  
  color  
){  
  
  const a=  
    document.createElement("a");  
  
  a.className=  
    "live-link "+  
    color;  
  
  a.href=  
    url || "#";  
  
  a.target="_blank";  
  
  a.rel="noopener";  
  
  a.textContent=  
    title;  
  
  
  return a;  
  
}

  );

    Array.isArray(m.info.latest) &&

        );

  socialSection.className=

  x.rel="noopener";  
  
  x.textContent=

  socialSection.appendChild(x);

}

/* =====================================================  
   ボス移動  
===================================================== */  
  
function dotBossUpdate(){  
  
  if(  
    dotActiveBosses.length === 0  
  ){  
    return;  
  }  
  
  
  dotActiveBosses.forEach(  
    function(boss){  
  
      if(boss.dead){  
        return;  
      }  
  
  
      /*  
        一番近いホロメンを探す  
      */  
  
      const target =  
        dotFindNearestToBoss(  
          boss  
        );  
  
  
      if(!target){  
        return;  
      }  
  
  
      boss.target =  
        target;  
  
  
      const dx =  
        target.x -  
        boss.x;  
  
  
      const dy =  
        target.y -  
        boss.y;  
  
  
      const distance =  
        Math.sqrt(  
          dx*dx +  
          dy*dy  
        );  
  
  
      /*  
        ボスが接近  
      */  
  
      if(distance > 8){  
  
        boss.x +=  
          dx / distance *  
          0.10;  
  
        boss.y +=  
          dy / distance *  
          0.10;  
  
      }  
  
  
      boss.wrapper.style.left =  
        boss.x+"vw";  
  
  
      boss.wrapper.style.top =  
        boss.y+"vh";  
  
  
      /*  
        攻撃  
      */  
  
      if(  
        distance <= 8 &&  
        boss.attackCooldown <= 0  
      ){  
  
        dotBossAttack(  
          boss,  
          target  
        );  
  
  
        boss.attackCooldown =  
          Math.floor(  
            dotRandom(100,180)  
          );  
  
      }  
  
  
      if(  
        boss.attackCooldown > 0  
      ){  
  
        boss.attackCooldown--;  
  
      }  
  
    }  
  );  
  
}

/* =====================================================  
   ボスへの銃撃  
===================================================== */  
  
function dotShootBoss(  
  character  
){  
  
  if(  
    !dotBossBattleActive() ||  
    !character ||  
    character.defeated  
  ){  
    return;  
  }  
  
  
  /*  
    弾  
  */  
  
  const bullet =  
    document.createElement("div");  
  
  
  bullet.className =  
    "dotBullet";  
  
  
  bullet.textContent =  
    "•";  
  
  
  bullet.style.position =  
    "fixed";  
  
  
  bullet.style.zIndex =  
    "99999";  
  
  
  bullet.style.fontSize =  
    "24px";  
  
  
  bullet.style.fontWeight =  
    "bold";  
  
  
  bullet.style.pointerEvents =  
    "none";  
  
  
  document.body.appendChild(  
    bullet  
  );  
  
  
  /*  
    ホロメン位置  
  */  
  
  const rect =  
    character.img.getBoundingClientRect();  
  
  
  let x =  
    rect.left +  
    rect.width / 2;  
  
  
  let y =  
    rect.top +  
    rect.height / 2;  
  
  
  /*  
    一番近いボスを狙う  
  */  
  
  let targetBoss =  
    null;  
  
  
  let nearestDistance =  
    Infinity;  
  
  
  dotActiveBosses.forEach(  
    function(boss){  
  
      const dx =  
        boss.img.getBoundingClientRect().left -  
        x;  
  
      const dy =  
        boss.img.getBoundingClientRect().top -  
        y;  
  
  
      const distance =  
        Math.sqrt(  
          dx*dx +  
          dy*dy  
        );  
  
  
      if(  
        distance <  
        nearestDistance  
      ){  
  
        nearestDistance =  
          distance;  
  
        targetBoss =  
          boss;  
  
      }  
  
    }  
  );  
  
  
  if(!targetBoss){  
  
    bullet.remove();  
  
    return;  
  
  }  
  
  
  const bossRect =  
    targetBoss.img.getBoundingClientRect();  
  
  
  const targetX =  
    bossRect.left +  
    bossRect.width / 2;  
  
  
  const targetY =  
    bossRect.top +  
    bossRect.height / 2;  
  
  
  const dx =  
    targetX-x;  
  
  
  const dy =  
    targetY-y;  
  
  
  const distance =  
    Math.sqrt(  
      dx*dx +  
      dy*dy  
    );  
  
  
  if(distance <= 0){  
  
    bullet.remove();  
  
    return;  
  
  }  
  
  
  const speed =  
    10;  
  
  
  const vx =  
    dx/distance*speed;  
  
  
  const vy =  
    dy/distance*speed;  
  
  
  function moveBullet(){  
  
    /*  
      ボスが消えた  
    */  
  
    if(  
      !dotBossBattleActive() ||  
      !targetBoss ||  
      targetBoss.dead  
    ){  
  
      bullet.remove();  
  
      return;  
  
    }  
  
  
    x += vx;  
    y += vy;  
  
  
    bullet.style.left =  
      x+"px";  
  
  
    bullet.style.top =  
      y+"px";  
  
  
    /*  
      最新のボス位置  
    */  
  
    const bossRectNow =  
      targetBoss.img.getBoundingClientRect();  
  
  
    const bossX =  
      bossRectNow.left +  
      bossRectNow.width/2;  
  
  
    const bossY =  
      bossRectNow.top +  
      bossRectNow.height/2;  
  
  
    const hitX =  
      bossX-x;  
  
  
    const hitY =  
      bossY-y;  
  
  
    const hitDistance =  
      Math.sqrt(  
        hitX*hitX +  
        hitY*hitY  
      );  
  
  
    /*  
      命中  
    */  
  
    if(  
      hitDistance <  
      Math.max(  
        35,  
        bossRectNow.width/2  
      )  
    ){  
  
      bullet.remove();  
  
  
      targetBoss.hp -=  
        10;  
  
  
      dotBossShowHP();  
  
  
      /*  
        このボスだけ撃破  
      */  
  
      if(  
        targetBoss.hp <= 0  
      ){  
  
        dotDefeatSingleBoss(  
          targetBoss  
        );  
  
      }  
  
  
      return;  
  
    }  
  
  
    /*  
      画面外  
    */  
  
    if(  
      x < -100 ||  
      x > window.innerWidth+100 ||  
      y < -100 ||  
      y > window.innerHeight+100  
    ){  
  
      bullet.remove();  
  
      return;  
  
    }  
  
  
    requestAnimationFrame(  
      moveBullet  
    );  
  
  }  
  
  
  moveBullet();  
  
}  
  
  
/* =====================================================  
   1体のボス撃破  
===================================================== */  
  
function dotDefeatSingleBoss(  
  boss  
){  
  
  if(  
    !boss ||  
    boss.dead  
  ){  
    return;  
  }  
  
  
  boss.dead =  
    true;  
  
  
  /*  
    爆発  
  */  
  
  const explosion =  
    document.createElement("div");  
  
  
  explosion.textContent =  
    "💥";  
  
  
  explosion.style.position =  
    "absolute";  
  
  
  explosion.style.left =  
    "5px";  
  
  
  explosion.style.top =  
    "-10px";  
  
  
  explosion.style.fontSize =  
    "80px";  
  
  
  explosion.style.zIndex =  
    "10000";  
  
  
  explosion.style.pointerEvents =  
    "none";  
  
  
  boss.wrapper.appendChild(  
    explosion  
  );  
  
  
  /*  
    一覧から削除  
  */  
  
  const index =  
    dotActiveBosses.indexOf(  
      boss  
    );  
  
  
  if(index !== -1){  
  
    dotActiveBosses.splice(  
      index,  
      1  
    );  
  
  }  
  
  
  dotBossShowHP();  
  
  
  /*  
    ボスを消す  
  */  
  
  setTimeout(  
    function(){  
  
      if(  
        boss.wrapper &&  
        boss.wrapper.parentNode  
      ){  
  
        boss.wrapper.remove();  
  
      }  
  
    },  
    700  
  );  
  
  
  /*  
    まだボスが残っている  
  */  
  
  if(  
    dotActiveBosses.length > 0  
  ){  
  
    return;  
  
  }  
  
  
  /*  
    全ボス撃破  
    → ボス戦終了  
  */  
  
  dotFinishBossBattle();  
  
}  
  
  
/* =====================================================  
   ボス戦終了  
===================================================== */  
  
function dotFinishBossBattle(){  
  
  /*  
    全員を通常状態へ戻す  
  */  
  
  dotCharacters.forEach(  
    function(character){  
  
      if(  
        character.defeated ||  
        character.rescuing  
      ){  
        return;  
      }  
  
  
      dotClearExtras(  
        character  
      );  
  
  
      character.action =  
        "idle";  
  
  
      character.timer =  
        Math.floor(  
          dotRandom(120,300)  
        );  
  
  
      character.img.className =  
        "dotHolo idle";  
  
    }  
  );  
  
  
  /*  
    倒れている人を全員救助  
  */  
  
  const defeated =  
    dotCharacters.filter(  
      function(character){  
  
        return character.defeated;  
  
      }  
    );  
  
  
  defeated.forEach(  
    function(target){  
  
      dotStartRescue(  
        target  
      );  
  
    }  
  );  
  
  
  /*  
    次のボス  
  */  
  
  dotBossTimer =  
    Math.floor(  
      dotRandom(900,1800)  
    );  
  
}  
  
  
/* =====================================================  
   救助開始  
===================================================== */  
  
function dotStartRescue(  
  target  
){  
  
  if(  
    !target ||  
    !target.defeated ||  
    target.rescuing  
  ){  
    return;  
  }  
  
  
  /*  
    生存者から2人選ぶ  
  */  
  
  const candidates =  
    dotCharacters.filter(  
      function(character){  
  
        return(  
          character !== target &&  
          !character.defeated &&  
          !character.rescuing  
        );  
  
      }  
    );  
  
  
  /*  
    近い順に並べる  
  */  
  
  candidates.sort(  
    function(a,b){  
  
      const da =  
        Math.sqrt(  
          Math.pow(  
            a.x-target.x,  
            2  
          )+  
          Math.pow(  
            a.y-target.y,  
            2  
          )  
        );  
  
  
      const db =  
        Math.sqrt(  
          Math.pow(  
            b.x-target.x,  
            2  
          )+  
          Math.pow(  
            b.y-target.y,  
            2  
          )  
        );  
  
  
      return da-db;  
  
    }  
  );  
  
  
  /*  
    最大2人  
  */  
  
  const helpers =  
    candidates.slice(0,2);  
  
  
  /*  
    誰もいなければ  
    少し後に再試行  
  */  
  
  if(  
    helpers.length === 0  
  ){  
  
    setTimeout(  
      function(){  
  
        dotStartRescue(  
          target  
        );  
  
      },  
      1000  
    );  
  
    return;  
  
  }  
  
  
  target.rescuing =  
    true;  
  
  
  helpers.forEach(  
    function(helper){  
  
      helper.rescuing =  
        true;  
  
  
      helper.action =  
        "rescue";  
  
  
      helper.timer =  
        999999;  
  
  
      dotClearExtras(  
        helper  
      );  
  
  
      helper.img.className =  
        "dotHolo idle";  
  
    }  
  );  
  
  
  function updateRescue(){  
  
    if(  
      !target.defeated  
    ){  
  
      helpers.forEach(  
        function(helper){  
  
          helper.rescuing =  
            false;  
  
        }  
      );  
  
      return;  
  
    }  
  
  
    helpers.forEach(  
      function(helper,index){  
  
        /*  
          左右から挟む  
        */  
  
        const side =  
          index === 0  
          ? -1  
          : 1;  
  
  
        const targetX =  
          target.x +  
          side*5;  
  
  
        const targetY =  
          target.y;  
  
  
        const dx =  
          targetX -  
          helper.x;  
  
  
        const dy =  
          targetY -  
          helper.y;  
  
  
        const distance =  
          Math.sqrt(  
            dx*dx +  
            dy*dy  
          );  
  
  
        if(  
          distance > 1  
        ){  
  
          helper.x +=  
            dx/distance*  
            0.15;  
  
  
          helper.y +=  
            dy/distance*  
            0.15;  
  
        }  
  
  
        helper.wrapper.style.left =  
          helper.x+"vw";  
  
  
        helper.wrapper.style.top =  
          helper.y+"vh";  
  
      }  
    );  
  
  
    /*  
      2人とも到着  
    */  
  
    const ready =  
      helpers.every(  
        function(helper){  
  
          const dx =  
            helper.x -  
            target.x;  
  
  
          const dy =  
            helper.y -  
            target.y;  
  
  
          return(  
            Math.sqrt(  
              dx*dx+  
              dy*dy  
            ) < 7  
          );  
  
        }  
      );  
  
  
    if(ready){  
  
      /*  
        ハート  
      */  
  
      helpers.forEach(  
        function(helper){  
  
          dotAddHeart(  
            helper  
          );  
  
        }  
      );  
  
  
      /*  
        少し待って復活  
      */  
  
      setTimeout(  
        function(){  
  
          dotReviveCharacter(  
            target  
          );  
  
  
          helpers.forEach(  
            function(helper){  
  
              helper.rescuing =  
                false;  
  
  
              helper.action =  
                "idle";  
  
  
              helper.timer =  
                Math.floor(  
                  dotRandom(120,300)  
                );  
  
  
              helper.img.className =  
                "dotHolo idle";  
  
            }  
          );  
  
  
        },  
        1000  
      );  
  
  
      return;  
  
    }  
  
  
    requestAnimationFrame(  
      updateRescue  
    );  
  
  }  
  
  
  updateRescue();  
  
}

/* =====================================================

function dotChooseAction(  
  character  
){  
  
  /*  
    倒れている  
  */  
  
  if(  
    character.defeated  
  ){  
  
    character.action =  
      "defeated";  
  
    return;  
  
  }  
  
  
  /*  
    救助中  
  */  
  
  if(  
    character.rescuing  
  ){  
  
    character.action =  
      "rescue";  
  
    return;  
  
  }  
  
  
  /*  
    ボス戦  
  */  
  
  if(  
    dotBossBattleActive()  
  ){  
  
    dotSetShootMode(  
      character  
    );  
  
    return;  
  
  }  
  
  
  /*  
    古い演出を必ず消す  
  */  
  
  dotClearExtras(  
    character  
  );  
  
  
  /*  
    追いかけっこ中  
  */  
  
  if(  
    character.chasing  
  ){  
  
    character.action =  
      "chase";  
  
    character.timer =  
      999999;  
  
    character.img.className =  
      "dotHolo run";  
  
    return;  
  
  }  
  
  
  /*  
    通常行動  
  */  
  
  const action =  
    dotActions[  
      Math.floor(  
        Math.random() *  
        dotActions.length  
      )  
    ];  
  
  
  character.action =  
    action;  
  
  
  character.timer =  
    Math.floor(  
      dotRandom(  
        120,  
        420  
      )  
    );  
  
  
  character.img.className =  
    "dotHolo " +  
    action;  
  
  
  /*  
    歩く方向  
  */  
  
  if(  
    action === "walk"  
  ){  
  
    character.direction =  
      Math.random() < .5  
      ? -1  
      : 1;  
  
  }  
  
  
  /*  
    🍙  
  */  
  
  if(  
    action === "eat"  
  ){  
  
    dotAddFood(  
      character  
    );  
  
  }  
  
  
  /*  
    💧  
  */  
  
  if(  
    action === "cry"  
  ){  
  
    dotAddTears(  
      character  
    );  
  
  }  
  
  
  /*  
    Zzz  
  */  
  
  if(  
    action === "sleep"  
  ){  
  
    dotAddSleep(  
      character  
    );  
  
  }  
  
}  
  
  
/* =====================================================  
   ドット移動  
===================================================== */  
  
function dotUpdate(  
  character  
){  
  
  /*  
    倒れている  
  */  
  
  if(  
    character.defeated  
  ){  
  
    requestAnimationFrame(  
      function(){  
  
        dotUpdate(  
          character  
        );  
  
      }  
    );  
  
    return;  
  
  }  
  
  
  /*  
    救助中  
  */  
  
  if(  
    character.rescuing  
  ){  
  
    requestAnimationFrame(  
      function(){  
  
        dotUpdate(  
          character  
        );  
  
      }  
    );  
  
    return;  
  
  }  
  
  
  /*  
    ボス戦  
  */  
  
  if(  
    character.action === "shoot" &&  
    dotBossBattleActive()  
  ){  
  
    /*  
      ランダム間隔で撃つ  
    */  
  
    character.shootCooldown--;  
  
  
    if(  
      character.shootCooldown <= 0  
    ){  
  
      dotShootBoss(  
        character  
      );  
  
  
      character.shootCooldown =  
        Math.floor(  
          dotRandom(12,35)  
        );  
  
    }  
  
  
    requestAnimationFrame(  
      function(){  
  
        dotUpdate(  
          character  
        );  
  
      }  
    );  
  
    return;  
  
  }  
  
  
  /*  
    追いかけっこ  
  */  
  
  if(  
    character.action === "chase"  
  ){  
  
    if(  
      character.chaseTarget &&  
      !character.chaseTarget.defeated  
    ){  
  
      const target =  
        character.chaseTarget;  
  
  
      const dx =  
        target.x -  
        character.x;  
  
  
      const dy =  
        target.y -  
        character.y;  
  
  
      const distance =  
        Math.sqrt(  
          dx*dx+  
          dy*dy  
        );  
  
  
      if(  
        distance > 2  
      ){  
  
        character.x +=  
          dx/distance*  
          character.speed*  
          1.5;  
  
  
        character.y +=  
          dy/distance*  
          character.speed*  
          1.5;  
  
      }  
  
    }  
  
  }  
  
  
  /*  
    通常タイマー  
  */  
  
  character.timer--;  
  
  
  /*  
    横移動  
  */  
  
  if(  
    character.action === "walk" ||  
    character.action === "run"  
  ){  
  
    character.x +=  
      character.speed *  
      character.direction *  
      (  
        character.action === "run"  
        ? 2  
        : 1  
      );  
  
  
    if(  
      character.x > 94  
    ){  
  
      character.x =  
        94;  
  
      character.direction =  
        -1;  
  
    }  
  
  
    if(  
      character.x < 2  
    ){  
  
      character.x =  
        2;  
  
      character.direction =  
        1;  
  
    }  
  
  }  
  
  
  /*  
    ジャンプ  
  */  
  
  if(  
    character.action === "jump"  
  ){  
  
    character.y +=  
      Math.sin(  
        character.timer /  
        60 *  
        Math.PI*2  
      ) *  
      0.08;  
  
  }  
  
  
  /*  
    爆発  
  */  
  
  if(  
    character.action === "explode" &&  
    !character.explosion  
  ){  
  
    dotAddExplosion(  
      character  
    );  
  
  }  
  
  
  /*  
    回復  
  */  
  
  if(  
    character.action === "heal" &&  
    !character.healEffect  
  ){  
  
    dotAddHeal(  
      character  
    );  
  
  }  
  
  
  /*  
    サッカー  
  */  
  
  if(  
    character.action === "soccer" &&  
    !character.ball  
  ){  
  
    dotAddSoccer(  
      character  
    );  
  
  }  
  
  
  /*  
    位置反映  
  */  
  
  character.wrapper.style.left =  
    character.x+"vw";  
  
  
  character.wrapper.style.top =  
    character.y+"vh";  
  
  
  /*  
    行動終了  
  */  
  
  if(  
    character.timer <= 0  
  ){  
  
    dotClearExtras(  
      character  
    );  
  
  
    character.chasing =  
      false;  
  
  
    character.chaseTarget =  
      null;  
  
  
    dotChooseAction(  
      character  
    );  
  
  }  
  
  
  requestAnimationFrame(  
    function(){  
  
      dotUpdate(  
        character  
      );  
  
    }  
  );  
  
}

/* =====================================================  
   追いかけっこ開始  
===================================================== */  
  
function dotStartChase(){  
  
  /*  
    ボス戦中はやらない  
  */  
  
  if(  
    dotBossBattleActive()  
  ){  
    return;  
  }  
  
  
  /*  
    救助中は除外  
  */  
  
  const available =  
    dotCharacters.filter(  
      function(character){  
  
        return(  
          !character.defeated &&  
          !character.rescuing &&  
          !character.chasing  
        );  
  
      }  
    );  
  
  
  if(  
    available.length < 2  
  ){  
    return;  
  }  
  
  
  /*  
    ランダムに2～4人  
  */  
  
  const count =  
    Math.min(  
      available.length,  
      Math.floor(  
        dotRandom(2,5)  
      )  
    );  
  
  
  /*  
    シャッフル  
  */  
  
  for(  
    let i=available.length-1;  
    i>0;  
    i--  
  ){  
  
    const j =  
      Math.floor(  
        Math.random()*(i+1)  
      );  
  
  
    [  
      available[i],  
      available[j]  
    ] =  
    [  
      available[j],  
      available[i]  
    ];  
  
  }  
  
  
  const group =  
    available.slice(  
      0,  
      count  
    );  
  
  
  /*  
    輪になって追いかける  
  */  
  
  group.forEach(  
    function(character,index){  
  
      character.chasing =  
        true;  
  
  
      character.action =  
        "chase";  
  
  
      character.timer =  
        999999;  
  
  
      character.img.className =  
        "dotHolo run";  
  
  
      /*  
        次の人を追う  
      */  
  
      character.chaseTarget =  
        group[  
          (index+1) %  
          group.length  
        ];  
  
    }  
  );  
  
  
  /*  
    追いかけっこの時間  
  */  
  
  setTimeout(  
    function(){  
  
      group.forEach(  
        function(character){  
  
          if(  
            !character.defeated &&  
            !character.rescuing  
          ){  
  
            character.chasing =  
              false;  
  
  
            character.chaseTarget =  
              null;  
  
  
            character.timer =  
              Math.floor(  
                dotRandom(120,300)  
              );  
  
  
            character.action =  
              "idle";  
  
  
            character.img.className =  
              "dotHolo idle";  
  
          }  
  
        }  
      );  
  
    },  
    Math.floor(  
      dotRandom(3000,8000)  
    )  
  );  
  
}  
  
  
/* =====================================================

function dotChaseSystem(){  
  
  /*  
    ボス戦中はタイマーを進めない  
  */  
  
  if(  
    !dotBossBattleActive()  
  ){  
  
    dotChaseTimer--;  
  
  
    if(  
      dotChaseTimer <= 0  
    ){  
  
      dotStartChase();  
  
  
      dotChaseTimer =  
        Math.floor(  
          dotRandom(600,1800)  
        );  
  
    }  
  
  }  
  
  
  requestAnimationFrame(  
    dotChaseSystem  
  );  
  
}  
  
  
/* =====================================================

function shuffleArray(  
  array  
){  
  
  const a =  
    [...array];  
  
  
  for(  
    let i=a.length-1;  
    i>0;  
    i--  
  ){  
  
    const j =  
      Math.floor(  
        Math.random()*(i+1)  
      );  
  
  
    [  
      a[i],  
      a[j]  
    ] =  
    [  
      a[j],  
      a[i]  
    ];  
  
  }  
  
  
  return a;  
  
}  
  
  
/* =====================================================  
   キャラクター作成  
===================================================== */  
  
function createDotHolo(  
  data,  
  index  
){  
  
  const wrapper =  
    document.createElement("div");  
  
  
  wrapper.style.position =  
    "absolute";  
  
  
  wrapper.style.left =  
    dotRandom(5,90)+"vw";  
  
  
  wrapper.style.top =  
    dotRandom(15,85)+"vh";  
  
  
  const img =  
    document.createElement("img");  
  
  
  img.className =  
    "dotHolo idle";  
  
  
  img.src =  
    "ドットホロメン/" +  
    data.image;  
  
  
  img.alt =  
    data.name;  
  
  
  img.draggable =  
    false;  
  
  
  wrapper.appendChild(  
    img  
  );  
  
  
  dotHoloWorld.appendChild(  
    wrapper  
  );  
  
  
  /*  
    キャラクター情報  
  */  
  
  const character = {  
  
    wrapper:wrapper,  
  
    img:img,  
  
    x:parseFloat(  
      wrapper.style.left  
    ),  
  
    y:parseFloat(  
      wrapper.style.top  
    ),  
  
    action:"idle",  
  
    direction:  
      Math.random()<0.5  
      ? -1  
      : 1,  
  
    speed:  
      dotRandom(  
        0.04,  
        0.12  
      ),  
  
    timer:0,  
  
    index:index,  
  
    /*  
      状態  
    */  
  
    defeated:false,  
  
    rescuing:false,  
  
    chasing:false,  
  
    chaseTarget:null,  
  
    /*  
      エフェクト  
    */  
  
    bullet:null,  
  
    explosion:null,  
  
    healEffect:null,  
  
    ball:null,  
  
    food:null,  
  
    tears:null,  
  
    sleepMark:null,  
  
    /*  
      射撃  
    */  
  
    shootCooldown:  
      Math.floor(  
        dotRandom(10,40)  
      )  
  
  };  
  
  
  dotCharacters.push(  
    character  
  );  
  
  
  dotChooseAction(  
    character  
  );  
  
  
  requestAnimationFrame(  
    function(){  
  
      dotUpdate(  
        character  
      );  
  
    }  
  );  
  
}  
  
  
/* =====================================================  
   ボスシステム  
===================================================== */  
  
function dotBossSystem(){  
  
  /*  
    ボスがいない時だけ  
    出現タイマーを進める  
  */  
  
  if(  
    !dotBossBattleActive()  
  ){  
  
    dotBossTimer--;  
  
  
    if(  
      dotBossTimer <= 0  
    ){  
  
      dotSpawnBoss();  
  
    }  
  
  }  
  
  
  /*  
    ボスを全員動かす  
  */  
  
  dotBossUpdate();  
  
  
  /*  
    HPが0になったボスを処理  
  */  
  
  dotActiveBosses.forEach(  
    function(boss){  
  
      if(  
        !boss.dead &&  
        boss.hp <= 0  
      ){  
  
        dotDefeatSingleBoss(  
          boss  
        );  
  
      }  
  
    }  
  );  
  
  
  requestAnimationFrame(  
    dotBossSystem  
  );  
  
}  
  
  
/* =====================================================  
   キャラクター生成  
===================================================== */  
  
const selectedDots =  
  shuffleArray(  
    dotHolomembers  
  ).slice(  
    0,  
    15  
  );  
  
  
selectedDots.forEach(  
  function(member,index){  
  
    createDotHolo(  
      member,  
      index  
    );  
  
  }  
);  
  
  
/* =====================================================  
   システム開始  
===================================================== */  
  
dotBossSystem();  
  
dotChaseSystem();  


</script>  
  
</body>  
</html>
