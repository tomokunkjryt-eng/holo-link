<style>  
  
*{  
  box-sizing:border-box;  
}  
  
body{  
  margin:0;  
  background:#f4f6fa;  
  color:#222;  
  font-family:  
    Arial,  
    "Noto Sans JP",  
    sans-serif;  
}  
  
header{  
  position:sticky;  
  top:0;  
  z-index:50;  
  background:rgba(255,255,255,.97);  
  padding:15px 12px;  
  text-align:center;  
  box-shadow:0 2px 12px #ccc;  
}  
  
h1{  
  margin:0 0 13px;  
  font-size:24px;  
}  
  
/* =========================  
   検索＋フィルター  
========================= */  
  
.controls{  
  max-width:700px;  
  margin:auto;  
  display:flex;  
  gap:8px;  
  align-items:center;  
}  
  
#search{  
  flex:1;  
  min-width:0;  
  padding:11px 13px;  
  border:1px solid #ccc;  
  border-radius:11px;  
  font-size:14px;  
  outline:none;  
}  
  
#search:focus{  
  border-color:#1683ff;  
}  
  
.filter-wrap{  
  position:relative;  
}  
  
#filterButton{  
  width:110px;  
  padding:11px 8px;  
  border:1px solid #ccc;  
  border-radius:11px;  
  background:white;  
  font-size:13px;  
  cursor:pointer;  
  white-space:nowrap;  
}  
  
#filterButton:active{  
  transform:scale(.97);  
}  
  
#filterArea{  
  display:none;  
  position:absolute;  
  right:0;  
  top:calc(100% + 7px);  
  width:220px;  
  max-height:420px;  
  overflow-y:auto;  
  padding:8px;  
  background:white;  
  border-radius:13px;  
  box-shadow:0 5px 20px rgba(0,0,0,.2);  
  z-index:100;  
}  
  
#filterArea.show{  
  display:block;  
}  
  
.filter-grid{  
  display:flex;  
  flex-direction:column;  
  gap:5px;  
}  
  
.filter{  
  width:100%;  
  padding:9px;  
  border:1px solid #ddd;  
  border-radius:9px;  
  background:white;  
  text-align:left;  
  cursor:pointer;  
  font-size:13px;  
}  
  
.filter.active{  
  background:#1683ff;  
  color:white;  
  border-color:#1683ff;  
}  
  
#status{  
  margin-top:9px;  
  font-size:12px;  
  color:#666;  
}  
  
/* =========================  
   メンバー  
========================= */  
  
#members{  
  max-width:1250px;  
  margin:20px auto;  
  padding:0 12px 40px;  
  
  display:grid;  
  
  grid-template-columns:  
    repeat(auto-fill,minmax(190px,1fr));  
  
  gap:15px;  
}  
  
.card{  
  background:white;  
  border-radius:17px;  
  padding:12px;  
  text-align:center;  
  
  box-shadow:0 3px 12px #ddd;  
  
  transition:.15s;  
  
  border:4px solid transparent;  
  
  cursor:pointer;  
}  
  
.card:active{  
  transform:scale(.98);  
}  
  
.card.live{  
  border-color:#ff2222;  
}  
  
.card.upcoming{  
  border-color:#1683ff;  
}  
  
.card.live.upcoming{  
  border-color:#ff2222;  
  
  box-shadow:  
    0 0 0 3px #1683ff,  
    0 3px 12px #ddd;  
}  
  
.hidden{  
  display:none!important;  
}  
  
.profile-button{  
  display:block;  
  
  width:120px;  
  height:120px;  
  
  margin:auto;  
  
  border:0;  
  padding:0;  
  
  border-radius:50%;  
  
  background:none;  
  
  position:relative;  
}  
  
.avatar{  
  width:120px;  
  height:120px;  
  
  border-radius:50%;  
  
  object-fit:cover;  
  
  border:4px solid transparent;  
  
  background:#eee;  
}  
  
.avatar.live{  
  border-color:#ff2222;  
}  
  
.avatar.upcoming{  
  border-color:#1683ff;  
}  
  
.status-badge{  
  position:absolute;  
  
  left:50%;  
  bottom:-3px;  
  
  transform:translateX(-50%);  
  
  padding:3px 8px;  
  
  border-radius:999px;  
  
  color:white;  
  
  font-size:10px;  
  font-weight:bold;  
  
  white-space:nowrap;  
}  
  
.status-badge.live{  
  background:#f22;  
}  
  
.status-badge.upcoming{  
  background:#1683ff;  
}  
  
.name{  
  margin-top:10px;  
  font-size:16px;  
  font-weight:bold;  
}  
  
.group{  
  margin-top:3px;  
  font-size:12px;  
  color:#666;  
}  
  
.date{  
  margin-top:4px;  
  font-size:11px;  
  color:#999;  
}  
  
.socials{  
  display:flex;  
  justify-content:center;  
  gap:9px;  
  margin-top:11px;  
}  
  
.social{  
  width:40px;  
  height:40px;  
  
  border-radius:50%;  
  
  overflow:hidden;  
  
  background:#eee;  
  
  display:block;  
}  
  
.social img{  
  width:100%;  
  height:100%;  
  object-fit:cover;  
}  
  
.live-mini{  
  margin-top:8px;  
  font-size:10px;  
  color:#f22;  
  font-weight:bold;  
}  
  
.upcoming-mini{  
  margin-top:4px;  
  font-size:10px;  
  color:#1683ff;  
  font-weight:bold;  
}  
  
/* =========================  
   最新楽曲ボタン  
========================= */  
  
.song-button{  
  display:block;  
  
  width:100%;  
  
  margin-top:9px;  
  
  padding:9px 7px;  
  
  border-radius:9px;  
  
  background:#f0f2f5;  
  
  color:#333;  
  
  text-decoration:none;  
  
  font-size:11px;  
  
  transition:.15s;  
}  
  
.song-button:hover{  
  background:#ddd;  
}  
  
.song-button.waiting{  
  color:#777;  
  cursor:default;  
}  
  
/* =========================  
   モーダル  
========================= */  
  
#modalBg{  
  display:none;  
  
  position:fixed;  
  
  inset:0;  
  
  z-index:100;  
  
  background:rgba(0,0,0,.6);  
  
  padding:15px;  
  
  overflow:auto;  
}  
  
#modalBg.show{  
  display:flex;  
  
  align-items:center;  
  justify-content:center;  
}  
  
#modal{  
  width:min(600px,100%);  
  
  max-height:92vh;  
  
  overflow:auto;  
  
  background:white;  
  
  border-radius:20px;  
  
  padding:20px;  
  
  position:relative;  
}  
  
#closeModal{  
  position:absolute;  
  
  right:12px;  
  top:7px;  
  
  width:38px;  
  height:38px;  
  
  border:0;  
  
  background:#eee;  
  
  border-radius:50%;  
  
  font-size:24px;

}  
  
#modalAvatar{

  height:110px;  
  
  border-radius:50%;  
  
  object-fit:cover;  
  
  display:block;  
  
  margin:5px auto 10px;  
}  
  
#modalTitle{  
  text-align:center;  
  
  font-size:21px;  
  
  margin:5px 40px 2px;  
}  
  
#modalGroup{  
  text-align:center;  
  
  color:#777;  
  
  font-size:12px;  
}  
  
.section{  
  margin-top:17px;  
  
  padding:13px;  
  
  background:#f4f5f7;  
  
  border-radius:13px;  
}  
  
.section-title{

  font-size:14px;

}  
  
.video{

  text-decoration:none;  
  
  color:#222;  
  
  background:white;  
  
  border-radius:11px;  
  
  overflow:hidden;  
  
  margin-top:8px;  
  
  box-shadow:0 2px 7px #ddd;  
}

  display:block;  
  
  width:100%;  
  
  aspect-ratio:16/9;  
  
  object-fit:cover;  
  
  background:#ddd;

}

  font-size:10px;  
  
  margin-top:3px;  
}

  background:#fff;  
  
  border-radius:11px;  
  
  padding:11px;

.live-link.red{

.live-link.blue{

}

  font-size:12px;  
}  
  /* =====================================================
   ドットホロメン
===================================================== */
<button id="dotHoloToggle">
  ドットホロメン：ON
</button>

#dotHoloWorld{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  overflow:hidden;
}


.dotHolo{
  position:absolute;


  width:40px;
  height:40px;


  object-fit:contain;


  image-rendering:pixelated;


  user-select:none;
  -webkit-user-drag:none;


  pointer-events:none;


  will-change:transform,left,top;


  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
}


.dotHolo.walk{
  animation:dotWalk .55s steps(2) infinite;
}


.dotHolo.idle{
  animation:dotIdle 1.8s steps(2) infinite;
}


.dotHolo.sit{
  animation:dotSit 2s steps(2) infinite;
}


.dotHolo.cry{
  animation:dotCry .45s steps(2) infinite;
}


.dotHolo.eat{
  animation:dotEat .65s steps(2) infinite;
}


.dotHolo.sleep{
  animation:dotSleep 2.2s steps(2) infinite;
}


@keyframes dotWalk{
  0%{
    margin-top:0;
    transform:rotate(-2deg);
  }


  50%{
    margin-top:-3px;
    transform:rotate(2deg);
  }


  100%{
    margin-top:0;
    transform:rotate(-2deg);
  }
}


@keyframes dotIdle{
  0%,100%{
    transform:translateY(0);
  }


  50%{
    transform:translateY(-1px);
  }
}


@keyframes dotSit{
  0%,100%{
    transform:translateY(4px) scaleY(.82);
  }


  50%{
    transform:translateY(5px) scaleY(.80);
  }
}


@keyframes dotCry{
  0%,100%{
    transform:translateX(0);
  }


  25%{
    transform:translateX(-2px);
  }


  75%{
    transform:translateX(2px);
  }
}


@keyframes dotEat{
  0%,100%{
    transform:translateY(0);
  }


  50%{
    transform:translateY(-2px);
  }
}


@keyframes dotSleep{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }


  50%{
    transform:translateY(2px) rotate(2deg);
  }
}


.dotFood{
  position:absolute;


  width:14px;
  height:14px;


  image-rendering:pixelated;


  pointer-events:none;


  z-index:2;
}


.dotTears{
  position:absolute;


  font-size:12px;


  pointer-events:none;


  animation:dotTear .7s steps(2) infinite;
}


@keyframes dotTear{
  0%{
    transform:translateY(0);
    opacity:1;
  }


  100%{
    transform:translateY(7px);
    opacity:.2;
  }
}


.dotSleepMark{
  position:absolute;


  font-size:12px;
  font-weight:bold;


  color:#777;


  pointer-events:none;


  animation:dotZzz 1.5s steps(3) infinite;
}


@keyframes dotZzz{
  0%{
    transform:translate(0,4px);
    opacity:.2;
  }


  50%{
    transform:translate(3px,-2px);
    opacity:1;
  }


  100%{
    transform:translate(6px,-8px);
    opacity:0;
  }
}



@media(max-width:600px){

    font-size:21px;

  .card{

    width:85px;  
    height:85px;  
  }  
  
  .avatar{  
    width:85px;  
    height:85px;  
    border-width:3px;  
  }  
  
  .name{  
    font-size:14px;  
    line-height:1.3;  
  }  
  
  .group{

  }  
  
  .date{

  }  
  
  .social{

    height:32px;  
  }  
  
  #filterButton{  
    width:100px;  
  }  
  
  #filterArea{  
    width:190px;  
  }  
  
}

/* =====================================================  
   画像  
===================================================== */  
  
function localImage(m){  
  
  return "images/"+m.image;  
  
}  
  
  
function setImage(img,url){  
  
  img.onerror=function(){  
  
    img.onerror=null;  
  
    img.src=fallbackAvatar;  
  
  };  
  
  img.src=url;  
  
}  
  
  
/* =====================================================  
   カード作成  
===================================================== */  
  
function createCard(m,index){  
  
  const card=  
  document.createElement("article");  
  
  card.className="card";  
  
  card.dataset.index=index;  
  
  card.dataset.name=  
    m.name.toLowerCase();  
  
  card.dataset.groups=  
    m.groups.join("|");  
  
  
  card.addEventListener(  
    "click",  
    function(e){  
  
      if(  
        e.target.closest(".social") ||  
        e.target.closest(".song-button")  
      ){  
  
        return;  
  
      }  
  
      openMember(index);  
  
    }  
  );  
  
  
  const profile=  
  document.createElement("div");  
  
  profile.className=  
    "profile-button";  
  
  
  const avatar=  
  document.createElement("img");  
  
  avatar.className="avatar";  
  
  avatar.id=  
    "avatar-"+index;  
  
  avatar.alt=  
    m.name;  
  
  setImage(  
    avatar,  
    localImage(m)  
  );  
  
  
  const badge=  
  document.createElement("span");  
  
  badge.className=  
    "status-badge";  
  
  badge.id=  
    "badge-"+index;  
  
  
  profile.appendChild(avatar);  
  profile.appendChild(badge);  
  
  
  const name=  
  document.createElement("div");  
  
  name.className="name";  
  
  name.textContent=  
    m.name;  
  
  
  const group=  
  document.createElement("div");  
  
  group.className="group";  
  
  group.textContent=  
    m.groups.join("　");  
  
  
  const date=  
  document.createElement("div");  
  
  date.className="date";  
  
  date.textContent=  
    "デビュー："+m.date;  
  
  
  const socials=  
  document.createElement("div");  
  
  socials.className="socials";  
  
  
  const yt=  
  document.createElement("a");  
  
  yt.className="social";  
  
  yt.href=  
    m.youtubeURL;  
  
  yt.target="_blank";  
  
  yt.rel="noopener";  
  
  
  const ytImg=  
  document.createElement("img");  
  
  ytImg.alt="YouTube";  
  
  setImage(  
    ytImg,  
    localImage(m)  
  );  
  
  yt.appendChild(ytImg);  
  
  
  const x=  
  document.createElement("a");  
  
  x.className="social";  
  
  x.href=  
    m.xURL;  
  
  x.target="_blank";  
  
  x.rel="noopener";  
  
  
  const xImg=  
  document.createElement("img");  
  
  xImg.alt="X";  
  
  setImage(  
    xImg,  
    "https://unavatar.io/x/"+m.x  
  );  
  
  x.appendChild(xImg);  
  
  
  socials.appendChild(yt);  
  socials.appendChild(x);  
  
  
  const song=  
  document.createElement("a");  
  
  song.className="song-button";  
  
  song.id=  
    "song-"+index;  
  
  song.textContent=  
    "🎵 最新の楽曲を読み込み中…";  
  
  
  song.addEventListener(  
    "click",  
    function(e){  
  
      e.stopPropagation();  
  
    }  
  );  
  
  
  const liveMini=  
  document.createElement("div");  
  
  liveMini.className="live-mini";  
  
  liveMini.id=  
    "live-mini-"+index;  
  
  
  const upcomingMini=  
  document.createElement("div");  
  
  upcomingMini.className=  
    "upcoming-mini";  
  
  upcomingMini.id=  
    "upcoming-mini-"+index;  
  
  
  card.appendChild(profile);  
  card.appendChild(name);  
  card.appendChild(group);  
  card.appendChild(date);  
  card.appendChild(socials);  
  card.appendChild(song);  
  card.appendChild(liveMini);  
  card.appendChild(upcomingMini);  
  
  membersBox.appendChild(card);  
  
}

/* =====================================================  
   フィルター  
===================================================== */  
  
let selectedGroup="all";  
  
  
function applyFilter(){  
  
  const query=  
    searchBox.value  
    .trim()  
    .toLowerCase();  
  
  
  document  
  .querySelectorAll(".card")  
  .forEach(function(card){  
  
    const name=  
      card.dataset.name;  
  
  
    const groups=  
      card.dataset.groups.split("|");  
  
  
    const nameOK=  
      name.includes(query);  
  
  
    const groupOK=  
      selectedGroup==="all" ||  
      groups.includes(selectedGroup);  
  
  
    card.classList.toggle(  
      "hidden",  
      !(nameOK && groupOK)  
    );  
  
  });  
  
}  
  
  
searchBox.addEventListener(  
  "input",  
  applyFilter  
);  
  
  
/*  
  フィルターボタン  
*/  
  
filterButton.addEventListener(  
  "click",  
  function(e){  
  
    e.stopPropagation();  
  
    filterArea.classList.toggle(  
      "show"  
    );  
  
  }  
);  
  
  
/*  
  フィルター選択  
*/  
  
document  
.querySelectorAll(".filter")  
.forEach(function(button){  
  
  button.addEventListener(  
    "click",  
    function(e){  
  
      e.stopPropagation();  
  
      selectedGroup=  
        button.dataset.group;  
  
  
      document  
      .querySelectorAll(".filter")  
      .forEach(function(x){  
  
        x.classList.remove(  
          "active"  
        );  
  
      });  
  
  
      button.classList.add(  
        "active"  
      );  
  
  
      filterButton.textContent=  
        selectedGroup==="all"  
        ?  
        "📂 フィルター"  
        :  
        "📂 "+selectedGroup;  
  
  
      filterArea.classList.remove(  
        "show"  
      );  
  
  
      applyFilter();  
  
    }  
  );  
  
});

/* =====================================================  
   時間  
===================================================== */  
  
function formatDateTime(value){  
  
  if(!value){  
    return "";  
  }  
  
  const d=  
    new Date(value);  
  
  if(  
    Number.isNaN(d.getTime())  
  ){  
    return "";  
  }  
  
  return d.toLocaleString(  
    "ja-JP",  
    {  
      month:"numeric",  
      day:"numeric",  
      hour:"2-digit",  
      minute:"2-digit"  
    }  
  );  
  
}  
  
  
function relativeTime(value){  
  
  if(!value){  
    return "";  
  }  
  
  const t=  
    new Date(value).getTime();  
  
  if(Number.isNaN(t)){  
    return "";  
  }  
  
  const diff=  
    Date.now()-t;  
  
  
  /*  
    未来  
  */  
  
  if(diff<0){  
  
    const minutes=  
      Math.floor(  
        (-diff)/60000  
      );  
  
  
    if(minutes<1){  
      return "まもなく開始";  
    }  
  
  
    if(minutes<60){  
  
      return(  
        minutes+  
        "分後に開始"  
      );  
  
    }  
  
  
    const hours=  
      Math.floor(  
        minutes/60  
      );  
  
    const min=  
      minutes%60;  
  
  
    if(min===0){  
  
      return(  
        hours+  
        "時間後に開始"  
      );  
  
    }  
  
  
    return(  
      hours+  
      "時間"+  
      min+  
      "分後に開始"  
    );  
  
  }  
  
  
  /*  
    過去  
  */  
  
  const minutes=  
    Math.floor(  
      diff/60000  
    );  
  
  
  if(minutes<1){  
    return "開始したばかり";  
  }  
  
  
  if(minutes<60){  
  
    return(  
      minutes+  
      "分前に開始"  
    );  
  
  }  
  
  
  const hours=  
    Math.floor(  
      minutes/60  
    );  
  
  
  if(hours<24){  
  
    const min=  
      minutes%60;  
  
    if(min===0){  
  
      return(  
        hours+  
        "時間前に開始"  
      );  
  
    }  
  
    return(  
      hours+  
      "時間"+  
      min+  
      "分前に開始"  
    );  
  
  }  
  
  
  return(  
    Math.floor(hours/24)+  
    "日前に開始"  
  );  
  
}  
  
  
/* =====================================================  
   Workerデータ正規化  
===================================================== */  
  
function normalizeMemberData(raw){  
  
  if(!raw){  
    return null;  
  }  
  
  
  const result={};  
  
  
  result.channelId=  
    raw.channelId ||  
    raw.channelID ||  
    raw.id ||  
    null;  
  
  
  result.avatar=  
    raw.avatar ||  
    raw.profileImage ||  
    raw.profileImageUrl ||  
    raw.thumbnail ||  
    raw.channelAvatar ||  
    raw.channelThumbnail ||  
    null;  
  
  
  result.isLive=  
    raw.isLive===true ||  
    raw.live===true ||  
    raw.liveStatus==="live" ||  
    raw.status==="live";  
  
  
  result.isUpcoming=  
    raw.isUpcoming===true ||  
    raw.upcoming===true ||  
    raw.liveStatus==="upcoming" ||  
    raw.status==="upcoming";  
  
  
  result.liveURL=  
    raw.liveURL ||  
    raw.liveUrl ||  
    raw.live_url ||  
    raw.liveVideoURL ||  
    raw.liveVideoUrl ||  
    null;  
  
  
  result.upcomingURL=  
    raw.upcomingURL ||  
    raw.upcomingUrl ||  
    raw.upcoming_url ||  
    raw.upcomingVideoURL ||  
    raw.upcomingVideoUrl ||  
    null;  
  
  
  result.liveTitle=  
    raw.liveTitle ||  
    raw.liveName ||  
    raw.liveVideoTitle ||  
    null;  
  
  
  result.upcomingTitle=  
    raw.upcomingTitle ||  
    raw.upcomingName ||  
    raw.upcomingVideoTitle ||  
    null;  
  
  
  result.liveStartTime=  
    raw.liveStartTime ||  
    raw.liveStartedAt ||  
    raw.liveStart ||  
    raw.liveScheduledStartTime ||  
    null;  
  
  
  result.upcomingStartTime=  
    raw.upcomingStartTime ||  
    raw.upcomingStartedAt ||  
    raw.upcomingStart ||  
    raw.upcomingScheduledStartTime ||  
    null;  
  
  
  result.liveThumb=  
    raw.liveThumb ||  
    raw.liveThumbnail ||  
    raw.liveThumbnailURL ||  
    null;  
  
  
  result.upcomingThumb=  
    raw.upcomingThumb ||  
    raw.upcomingThumbnail ||  
    raw.upcomingThumbnailURL ||  
    null;  
  
  
  /* =========================  
     最新動画  
  ========================= */  
  
  let latest=  
    raw.latest;  
  
  if(!Array.isArray(latest)){  
    latest=raw.latestVideos;  
  }  
  
  if(!Array.isArray(latest)){  
    latest=raw.videos;  
  }  
  
  if(!Array.isArray(latest)){  
    latest=raw.latestVideo;  
    if(latest) latest=[latest];  
  }  
  
  if(!Array.isArray(latest)){  
    latest=[];  
  }  
  
  
  result.latest=  
    latest  
    .map(function(video){  
  
      if(!video){  
        return null;  
      }  
  
  
      const id=  
        video.id ||  
        video.videoId ||  
        video.video_id ||  
        null;  
  
  
      const url=  
        video.url ||  
        video.videoURL ||  
        video.videoUrl ||  
        (  
          id  
          ?  
          "https://www.youtube.com/watch?v="+id  
          :  
          null  
        );  
  
  
      const title=  
        video.title ||  
        video.name ||  
        "YouTube動画";  
  
  
      const thumb=  
        video.thumb ||  
        video.thumbnail ||  
        video.thumbnailURL ||  
        (  
          id  
          ?  
          "https://i.ytimg.com/vi/"+id+  
          "/hqdefault.jpg"  
          :  
          null  
        );  
  
  
      const publishedAt=  
        video.publishedAt ||  
        video.publishDate ||  
        video.published ||  
        video.date ||  
        null;  
  
  
      return{  
        id:id,  
        url:url,  
        title:title,  
        thumb:thumb,  
        publishedAt:publishedAt  
      };  
  
    })  
    .filter(function(video){  
  
      return(  
        video &&  
        video.url  
      );  
  
    });  
  
  
  result.latest.sort(  
    function(a,b){  
  
      const ta=  
        new Date(  
          a.publishedAt || 0  
        ).getTime();  
  
      const tb=  
        new Date(  
          b.publishedAt || 0  
        ).getTime();  
  
      return tb-ta;  
  
    }  
  );  
  
  
  result.latest=  
    result.latest.slice(0,2);  
  
  
  /* =========================  
     最新楽曲  
  ========================= */  
  
  const song=  
    raw.latestSong ||  
    raw.latestMusic ||  
    raw.latestSongVideo ||  
    raw.latestMusicVideo ||  
    raw.song ||  
    raw.music ||  
    null;  
  
  
  if(song){  
  
    if(typeof song==="string"){  
  
      result.latestSong={  
        url:song  
      };  
  
    }  
    else{  
  
      const id=  
        song.id ||  
        song.videoId ||  
        song.video_id ||  
        null;  
  
  
      result.latestSong={  
        id:id,  
  
        url:  
          song.url ||  
          song.videoURL ||  
          song.videoUrl ||  
          (  
            id  
            ?  
            "https://www.youtube.com/watch?v="+id  
            :  
            null  
          ),  
  
        title:  
          song.title ||  
          song.name ||  
          "最新の楽曲"  
      };  
  
    }  
  
  }  
  else{  
  
    result.latestSong=null;  
  
  }  
  
  
  return result;  
  
}  
  
  
/* =====================================================  
   カード状態  
===================================================== */  
  
function updateCard(m,index){  
  
  const card=  
    document.querySelector(  
      '.card[data-index="'+index+'"]'  
    );  
  
  if(!card){  
    return;  
  }  
  
  
  const avatar=  
    document.getElementById(  
      "avatar-"+index  
    );  
  
  const badge=  
    document.getElementById(  
      "badge-"+index  
    );  
  
  const liveMini=  
    document.getElementById(  
      "live-mini-"+index  
    );  
  
  const upcomingMini=  
    document.getElementById(  
      "upcoming-mini-"+index  
    );  
  
  
  card.classList.remove(  
    "live",  
    "upcoming"  
  );  
  
  
  avatar.classList.remove(  
    "live",  
    "upcoming"  
  );  
  
  
  badge.className=  
    "status-badge";  
  
  badge.textContent="";  
  
  
  liveMini.textContent="";  
  
  upcomingMini.textContent="";  
  
  
  /*  
    LIVE  
  */  
  
  if(m.info.isLive){  
  
    card.classList.add("live");  
  
    avatar.classList.add("live");  
  
    badge.classList.add("live");  
  
    badge.textContent="LIVE";  
  
  
    liveMini.textContent=  
      "🔴 "+  
      (  
        relativeTime(  
          m.info.liveStartTime  
        ) ||  
        "LIVE配信中"  
      );  
  
  }  
  
  
  /*  
    待機  
  */  
  
  if(m.info.isUpcoming){  
  
    card.classList.add("upcoming");  
  
    upcomingMini.textContent=  
      "🔵 "+  
      (  
        relativeTime(  
          m.info.upcomingStartTime  
        ) ||  
        "ライブ待機中"  
      );  
  
  }  
  
  
  /*  
    LIVE＋待機  
    赤を内側  
    青を外側  
  */  
  
  if(  
    m.info.isLive &&  
    m.info.isUpcoming  
  ){  
  
    card.classList.add(  
      "live",  
      "upcoming"  
    );  
  
    avatar.classList.add("live");  
  
    avatar.classList.remove(  
      "upcoming"  
    );  
  
    badge.className=  
      "status-badge live";  
  
    badge.textContent=  
      "LIVE";  
  
  }  
  else if(  
    m.info.isUpcoming  
  ){  
  
    avatar.classList.add(  
      "upcoming"  
    );  
  
    badge.className=  
      "status-badge upcoming";  
  
    badge.textContent=  
      "待機中";  
  
  }  
  
  
  /*  
    最新楽曲  
  */  
  
  updateSongButton(m,index);  
  
}  
  
  
/* =====================================================  
   最新楽曲ボタン

function updateSongButton(m,index){  
  
  const button=  
    document.getElementById(  
      "song-"+index  
    );  
  
  if(!button){  
    return;  
  }  
  
  
  const song=  
    m.info.latestSong;

    button.target="_blank";  
  
    button.rel="noopener";

  }  
  else{

      "song-button waiting";

    button.removeAttribute("target");  
  
    button.removeAttribute("rel");  
  
    button.textContent=  
      "🎵 最新の楽曲がでるまで楽曲をお待ちください";  
  
  }  
  
}  
  
  
/* =====================================================  
   Worker取得  
===================================================== */  
  
async function refreshFromWorker(){  
  
  statusBox.textContent=  
    "YouTube情報を取得中…";  
  
  
  try{  
  
    const handles=  
      members.map(function(m){  
        return m.youtube;  
      });  
  
  
    const url=  
      WORKER_URL+  
      "?handles="+  
      encodeURIComponent(  
        handles.join(",")  
      );  
  
  
    const response=  
      await fetch(  
        url,  
        {  
          method:"GET",  
          cache:"no-store"  
        }  
      );  
  
  
    if(!response.ok){  
  
      throw new Error(  
        "Worker HTTP "+  
        response.status  
      );  
  
    }  
  
  
    const data=  
      await response.json();  
  
  
    /*  
      Workerの返却形式を  
      できるだけ柔軟に処理  
    */  
  
    let workerMembers=  
      data.members ||  
      data.data ||  
      data.result ||  
      data.channels ||  
      data;  
  
  
    /*  
      配列の場合  
    */  
  
    if(Array.isArray(workerMembers)){  
  
      const converted={};  
  
  
      workerMembers.forEach(  
        function(item){  
  
          if(!item){  
            return;  
          }  
  
  
          const key=  
            item.youtube ||  
            item.handle ||  
            item.channel ||  
            item.channelHandle ||  
            item.youtubeHandle;  
  
  
          if(key){  
  
            converted[key]=item;  
  
          }  
  
        }  
      );  
  
  
      workerMembers=  
        converted;  
  
    }  
  
  
    /*  
      各メンバー  
    */  
  
    members.forEach(  
      function(m,index){  
  
        let raw=null;  
  
  
        /*  
          普通のhandle  
        */  
  
        if(  
          workerMembers &&  
          typeof workerMembers==="object"  
        ){  
  
          raw=  
            workerMembers[m.youtube];  
  
        }  
  
  
        /*  
          大文字小文字無視  
        */  
  
        if(!raw){  
  
          const key=  
            Object.keys(  
              workerMembers || {}  
            )  
            .find(function(k){  
  
              return(  
                k.toLowerCase()===  
                m.youtube.toLowerCase()  
              );  
  
            });  
  
  
          if(key){  
  
            raw=  
              workerMembers[key];  
  
          }  
  
        }  
  
  
        /*  
          配列以外の特殊形式  
        */  
  
        if(  
          !raw &&  
          data[m.youtube]  
        ){  
  
          raw=  
            data[m.youtube];  
  
        }  
  
  
        if(!raw){  
          return;  
        }  
  
  
        const info=  
          normalizeMemberData(raw);  
  
  
        if(info){  
  
          /*  
            Workerの情報だけ更新。  
            メイン画像はlocal imagesを維持。  
          */  
  
          m.info=info;  
  
        }  
  
  
        updateCard(  
          m,  
          index  
        );  
  
      }  
    );  
  
  
    applyFilter();  
  
  
    statusBox.textContent=  
      members.length+  
      "人のYouTube情報を取得しました";  
  
  
  }  
  catch(error){  
  
    console.error(  
      "Worker Error:",  
      error  
    );  
  
  
    statusBox.textContent=  
      "YouTube情報を取得できませんでした";  
  
  
    members.forEach(  
      function(m,index){  
  
        updateCard(  
          m,  
          index  
        );  
  
      }  
    );  
  
  }  
  
}

/* =====================================================  
   動画カード  
===================================================== */  
  
function createVideo(video){  
  
  const a=  
    document.createElement("a");  
  
  a.className="video";  
  
  a.href=  
    video.url;  
  
  a.target="_blank";  
  
  a.rel="noopener";  
  
  
  if(video.thumb){  
  
    const img=  
      document.createElement("img");  
  
    img.src=  
      video.thumb;  
  
    img.alt="";  
  
    img.onerror=  
      function(){  
  
        img.style.display=  
          "none";  
  
      };  
  
  
    a.appendChild(img);  
  
  }  
  
  
  const text=  
    document.createElement("div");  
  
  text.className=  
    "video-text";  
  
  
  const title=  
    document.createElement("div");  
  
  title.textContent=  
    video.title;  
  
  
  const time=  
    document.createElement("div");  
  
  time.className=  
    "video-time";  
  
  
  time.textContent=  
    video.publishedAt  
    ?  
    formatDateTime(  
      video.publishedAt  
    )  
    :  
    "";  
  
  
  text.appendChild(title);  
  text.appendChild(time);  
  
  a.appendChild(text);  
  
  
  return a;  
  
}

  a.href=  
    url || "#";  
  
  a.target="_blank";  
  
  a.rel="noopener";  
  
  a.textContent=  
    title;  
  
  
  return a;  
  
}

    image:"YAGOO2.png",  
    hp:500
  },  
  {  
    name:"YAGOO3",  
    image:"YAGOO3.png",  
    hp:400  
  }  
];  
  
  
const dotActiveBosses = [];  
  
  
  
  
let dotChaseTimer =  
  Math.floor(dotRandom(600,1800));  
  
  
/* =====================================================  
   キャラクター  
===================================================== */  
  
const dotCharacters = [];  
  
  
/* =====================================================  
   救助  
===================================================== */  
  
const dotRescueTargets = [];  
  
  
/* =====================================================  
   待機中の補充グループ  
===================================================== */  
  
let dotAvailableMembers =  
  shuffleArray(dotHolomembers);  
  
  
/*  
  現在の15人グループ  
*/  
let dotCurrentGroup = [];  
  
  
/*  
  現在何人目のグループか  
*/  
let dotGroupNumber = 1;  
  
  
/* =====================================================  
   ランダム  
===================================================== */  
  
function dotRandom(min,max){  
  
  return Math.random() * (max-min) + min;  
  
}  
  
  
/* =====================================================  
   ボス戦中  
===================================================== */  
  
function dotBossBattleActive(){  
  
  return dotActiveBosses.length > 0;  
  
}  
  
  
/* =====================================================  
   範囲内  
===================================================== */  
  
function dotDistance(a,b){  
  
  const dx = a.x-b.x;  
  const dy = a.y-b.y;  
  
  return Math.sqrt(dx*dx+dy*dy);  
  
}  
  
  

/* =====================================================  
   最も近いボス  
===================================================== */  
  
function dotFindNearestBoss(character){  
  
  let nearest = null;  
  let distance = Infinity;  
  
  
  dotActiveBosses.forEach(function(boss){  
  
    if(boss.dead){  
      return;  
    }  
  
  
    const d =  
      Math.sqrt(  
        Math.pow(character.x-boss.x,2) +  
        Math.pow(character.y-boss.y,2)  
      );  
  
  
    if(d < distance){  
  
      distance = d;  
      nearest = boss;  
  
    }  
  
  });  
  
  
  return nearest;  
  
}  
  
  
/* =====================================================  
   最も近いホロメン  
===================================================== */  
  
function dotFindNearestToBoss(boss){  
  
  let nearest = null;  
  let distance = Infinity;  
  
  
  dotCharacters.forEach(function(character){  
  
    if(  
      character.defeated ||  
      character.rescuing  
    ){  
      return;  
    }  
  
  
    const d =  
      Math.sqrt(  
        Math.pow(character.x-boss.x,2) +  
        Math.pow(character.y-boss.y,2)  
      );  
  
  
    if(d < distance){  
  
      distance = d;  
      nearest = character;  
  
    }  
  
  });  
  
  
  return nearest;  
  
}  
  
  
/* =====================================================  
   ボス出現  
===================================================== */  
  
function dotSpawnBoss(){  
  
  if(dotActiveBosses.length > 0){  
    return;  
  }  
  
  
  /*  
    1～3体  
  */  
  
  const count =  
    Math.floor(dotRandom(1,4));  
  
  
  for(let i=0;i<count;i++){  
  
    const data =  
      dotBossTypes[  
        Math.floor(  
          Math.random()*dotBossTypes.length  
        )  
      ];  
  
  
    const wrapper =  
      document.createElement("div");  
  
  
    wrapper.className =  
      "dotBoss";  
  
  
    wrapper.style.position =  
      "absolute";  
  
  
    /*  
      画面右側から出現  
    */  
  
    wrapper.style.left =  
      dotRandom(88,94)+"vw";  
  
  
    wrapper.style.top =  
      dotRandom(12,80)+"vh";  
  
  
    const img =  
      document.createElement("img");  
  
  
    img.src =  
      "ドットホロメン/"+data.image;  
  
  
    img.alt =  
      data.name;  
  
  
    img.draggable =  
      false;  
  
  
    img.style.width =  
      "120px";  
  
  
    img.style.height =  
      "120px";  
  
  
    img.style.objectFit =  
      "contain";  
  
  
    wrapper.appendChild(img);  
  
  
    dotHoloWorld.appendChild(wrapper);  
  
  
    const boss = {  
  
      wrapper:wrapper,  
  
      img:img,  
  
      type:data.name,  
  
      x:parseFloat(  
        wrapper.style.left  
      ),  
  
      y:parseFloat(  
        wrapper.style.top  
      ),  
  
      hp:data.hp,  
  
      maxHp:data.hp,  
  
      target:null,  
  
      attackCooldown:  
        Math.floor(  
          dotRandom(30,120)  
        ),  
  
      dead:false,  
  
      speedMultiplier:1,  
  
      rangeAttackUsed:false,  
  
      beamCooldown:0,  
  
      splitDone:false  
  
    };  
  
  
    /*  
      ボス1  
      10%で3倍速  
    */  
  
    if(  
      data.name === "YAGOO1" &&  
      Math.random() < 0.10  
    ){  
  
      boss.speedMultiplier = 3;  
  
    }  
  
  
    dotActiveBosses.push(boss);  
  
  }  
  
  
  dotCharacters.forEach(function(character){  
  
    if(  
      !character.defeated &&  
      !character.rescuing  
    ){  
  
      dotSetShootMode(character);  
  
    }  
  
  });  
  
  
  
  
}  
  
  
/* =====================================================  
   射撃モード  
===================================================== */  
  
function dotSetShootMode(character){  
  
  character.action =  
    "shoot";  
  
  
  character.timer =  
    999999;  
  
  
  character.img.className =  
    "dotHolo shoot";  
  
}  
  
  
/* =====================================================  
   ボス移動  
===================================================== */  
  
function dotBossUpdate(){  
  
  if(dotActiveBosses.length === 0){  
    return;  
  }  
  
  
  dotActiveBosses.forEach(function(boss){  
  
    if(boss.dead){  
      return;  
    }  
  
  
    const target =  
      dotFindNearestToBoss(boss);  
  
  
    if(!target){  
  
      /*  
        全員いなくなった場合  
        ボスは徘徊  
      */  
  
      boss.x +=  
        Math.sin(  
          Date.now()/1500 + boss.x  
        ) * 0.03;  
  
      boss.y +=  
        Math.cos(  
          Date.now()/1700 + boss.y  
        ) * 0.03;  
  
      boss.x =  
        Math.max(  
          2,  
          Math.min(94,boss.x)  
        );  
  
      boss.y =  
        Math.max(  
          10,  
          Math.min(88,boss.y)  
        );  
  
    }  
    else{  
  
      boss.target =  
        target;  
  
  
      const dx =  
        target.x-boss.x;  
  
      const dy =  
        target.y-boss.y;  
  
      const distance =  
        Math.sqrt(dx*dx+dy*dy);  
  
  
      /*  
        近づく  
      */  
  
      if(distance > 8){  
  
        const speed =  
          0.10 *  
          boss.speedMultiplier;  
  
  
        boss.x +=  
          dx/distance*speed;  
  
        boss.y +=  
          dy/distance*speed;  
  
      }  
  
  
      /*  
        攻撃  
      */  
  
      if(  
        distance <= 8 &&  
        boss.attackCooldown <= 0  
      ){  
  
        dotBossAttack(  
          boss,  
          target  
        );  
  
  
        boss.attackCooldown =  
          Math.floor(  
            dotRandom(100,180)  
          );  
  
      }  
  
    }  
  
  
    /*  
      ボス2  
      20%で半径80px範囲攻撃  
    */  
  
    if(  
      boss.type === "YAGOO2" &&  
      !boss.rangeAttackUsed &&  
      Math.random() < 0.20/300  
    ){  
  
      boss.rangeAttackUsed = true;  
  
      dotBossRangeAttack(boss);  
  
    }  
  
  
    /*  
      ボス3 ビーム  
    */  
  
    if(  
      boss.type === "YAGOO3"  
    ){  
  
      boss.beamCooldown--;  
  
      if(  
        boss.beamCooldown <= 0  
      ){  
  
        dotBossBeam(boss);  
  
        boss.beamCooldown =  
          Math.floor(  
            dotRandom(180,360)  
          );  
  
      }  
  
    }  
  
  
    if(boss.attackCooldown > 0){  
      boss.attackCooldown--;  
    }  
  
  
    boss.wrapper.style.left =  
      boss.x+"vw";  
  
    boss.wrapper.style.top =  
      boss.y+"vh";  
  
  });  
  
}  
  
  
/* =====================================================  
   ボス通常攻撃  
===================================================== */  
  
function dotBossAttack(boss,character){  
  
  if(  
    !boss ||  
    !character ||  
    character.defeated  
  ){  
    return;  
  }  
  
  
  /*  
    ときのそらは一度だけ耐える  
  */  
  
  if(  
    character.name === "ときのそら" &&  
    !character.soraGuardUsed  
  ){  
  
    character.soraGuardUsed = true;  
  
    dotAddTextEffect(  
      character,  
      "✨耐えた！"  
    );  
  
    return;  
  
  }  
  
  
  /*  
    ロボ子の攻撃力強化などを考慮しても  
    ボス接触は基本的に撃破  
  */  
  
  dotDefeatCharacter(character);  
  
}  
  
  
/* =====================================================  
   ボス2 範囲攻撃  
===================================================== */  
  
function dotBossRangeAttack(boss){  
  
  dotAddBossEffect(  
    boss,  
    "💥"  
  );  
  
  
  dotCharacters.forEach(function(character){  
  
    if(character.defeated){  
      return;  
    }  
  
  
    /*  
      80pxをvw/vhの簡易距離に変換  
    */  
  
    const dx =  
      (character.x-boss.x) *  
      window.innerWidth/100;  
  
    const dy =  
      (character.y-boss.y) *  
      window.innerHeight/100;  
  
  
    const distance =  
      Math.sqrt(dx*dx+dy*dy);  
  
  
    if(distance <= 80){  
  
      dotDefeatCharacter(character);  
  
    }  
  
  });  
  
}  
  
  
/* =====================================================  
   ボス3 ビーム  
===================================================== */  
  
function dotBossBeam(boss){  
  
  const target =  
    dotFindNearestToBoss(boss);  
  
  
  if(!target){  
    return;  
  }  
  
  
  /*  
    ビーム方向  
  */  
  
  const dx =  
    target.x-boss.x;  
  
  const dy =  
    target.y-boss.y;  
  
  
  const length =  
    Math.sqrt(dx*dx+dy*dy);  
  
  
  if(length === 0){  
    return;  
  }  
  
  
  const nx =  
    dx/length;  
  
  const ny =  
    dy/length;  
  
  
  /*  
    ビーム表示  
  */  
  
  const beam =  
    document.createElement("div");  
  
  
  beam.textContent =  
    "━━━━━━━━━━━━";  
  
  
  beam.style.position =  
    "absolute";  
  
  beam.style.left =  
    "0";  
  
  beam.style.top =  
    "0";  
  
  beam.style.color =  
    "red";  
  
  beam.style.fontSize =  
    "28px";  
  
  beam.style.fontWeight =  
    "bold";  
  
  beam.style.transformOrigin =  
    "left center";  
  
  beam.style.transform =  
    "rotate("+  
    Math.atan2(dy,dx)*  
    180/Math.PI+  
    "deg)";  
  
  beam.style.width =  
    (length*2)+"px";  
  
  beam.style.zIndex =  
    "99999";  
  
  beam.style.pointerEvents =  
    "none";  
  
  
  boss.wrapper.appendChild(beam);  
  
  
  /*  
    ビーム上のホロメンを倒す  
  */  
  
  dotCharacters.forEach(function(character){  
  
    if(character.defeated){  
      return;  
    }  
  
  
    const px =  
      character.x-boss.x;  
  
    const py =  
      character.y-boss.y;  
  
  
    const projection =  
      px*nx + py*ny;  
  
  
    if(  
      projection < 0 ||  
      projection > length  
    ){  
      return;  
    }  
  
  
    const nearestX =  
      nx*projection;  
  
    const nearestY =  
      ny*projection;  
  
  
    const sideDistance =  
      Math.sqrt(  
        Math.pow(px-nearestX,2)+  
        Math.pow(py-nearestY,2)  
      );  
  
  
    /*  
      ビーム幅  
    */  
  
    if(sideDistance < 4){  
  
      dotDefeatCharacter(  
        character  
      );  
  
    }  
  
  });  
  
  
  setTimeout(function(){  
  
    beam.remove();  
  
  },500);  
  
}  
  
  
/* =====================================================  
   ボス撃破  
===================================================== */  
  
function dotDefeatSingleBoss(boss){  
  
  if(  
    !boss ||  
    boss.dead  
  ){  
    return;  
  }  
  
  
  boss.dead =  
    true;  
  
  
  /*  
    ボス1 5%分裂  
  */  
  
  if(  
    boss.type === "YAGOO1" &&  
    !boss.splitDone &&  
    Math.random() < 0.05  
  ){  
  
    boss.splitDone = true;  
  
    dotBossSplit(boss);  
  
  }  
  
  
  dotAddBossEffect(  
    boss,  
    "💥"  
  );  
  
  
  const index =  
    dotActiveBosses.indexOf(boss);  
  
  
  if(index !== -1){  
  
    dotActiveBosses.splice(  
      index,  
      1  
    );  
  
  }  
  
  
  
  
  
  setTimeout(function(){  
  
    if(  
      boss.wrapper &&  
      boss.wrapper.parentNode  
    ){  
  
      boss.wrapper.remove();  
  
    }  
  
  },700);  
  
  
  if(  
    dotActiveBosses.length > 0  
  ){  
    return;  
  }  
  
  
  dotFinishBossBattle();  
  
}  
  
  
/* =====================================================  
   ボス1 分裂  
===================================================== */  
  
function dotBossSplit(original){  
  
  for(let i=0;i<2;i++){  
  
    const wrapper =  
      document.createElement("div");  
  
  
    wrapper.className =  
      "dotBoss";  
  
  
    wrapper.style.position =  
      "absolute";  
  
  
    wrapper.style.left =  
      Math.max(  
        2,  
        Math.min(  
          94,  
          original.x+(i===0?-4:4)  
        )  
      )+"vw";  
  
  
    wrapper.style.top =  
      original.y+"vh";  
  
  
    const img =  
      document.createElement("img");  
  
  
    img.src =  
      "ドットホロメン/YAGOO1.png";  
  
  
    img.style.width =  
      "90px";  
  
  
    img.style.height =  
      "90px";  
  
  
    img.style.objectFit =  
      "contain";  
  
  
    wrapper.appendChild(img);  
  
    dotHoloWorld.appendChild(wrapper);  
  
  
    const hp =  
      Math.max(  
        30,  
        Math.floor(  
          original.maxHp/2  
        )  
      );  
  
  
    dotActiveBosses.push({  
  
      wrapper:wrapper,  
  
      img:img,  
  
      type:"YAGOO1",  
  
      x:parseFloat(  
        wrapper.style.left  
      ),  
  
      y:parseFloat(  
        wrapper.style.top  
      ),  
  
      hp:hp,  
  
      maxHp:hp,  
  
      target:null,  
  
      attackCooldown:  
        Math.floor(  
          dotRandom(60,120)  
        ),  
  
      dead:false,  
  
      speedMultiplier:  
        original.speedMultiplier,  
  
      rangeAttackUsed:false,  
  
      beamCooldown:0,  
  
      splitDone:true  
  
    });  
  
  }  
  
  
  
  
}  
  
  
/* =====================================================  
   ボス戦終了  
===================================================== */  
  
function dotFinishBossBattle(){  
  
  dotCharacters.forEach(function(character){  
  
    if(  
      character.defeated ||  
      character.rescuing  
    ){  
      return;  
    }  
  
  
    dotClearExtras(character);  
  
  
    character.action =  
      "idle";  
  
  
    character.timer =  
      Math.floor(  
        dotRandom(120,300)  
      );  
  
  
    character.img.className =  
      "dotHolo idle";  
  
  });  
  
  
  /*  
    倒れている人を救助  
  */  
  
  const defeated =  
    dotCharacters.filter(function(character){  
  
      return character.defeated;  
  
    });  
  
  
  defeated.forEach(function(target){  
  
    dotStartRescue(target);  
  
  });  
  
  
  dotBossTimer =  
    Math.floor(  
      dotRandom(900,1800)  
    );  
  
}  
  
  
/* =====================================================  
   救助  
===================================================== */  
  
function dotStartRescue(target){  
  
  if(  
    !target ||  
    !target.defeated ||  
    target.rescuing  
  ){  
    return;  
  }  
  
  
  const candidates =  
    dotCharacters.filter(function(character){  
  
      return(  
        character !== target &&  
        !character.defeated &&  
        !character.rescuing  
      );  
  
    });  
  
  
  /*  
    ランダムな2人ではなく  
    近い2人  
  */  
  
  candidates.sort(function(a,b){  
  
    return(  
      dotDistance(a,target)-  
      dotDistance(b,target)  
    );  
  
  });  
  
  
  const helpers =  
    candidates.slice(0,2);  
  
  
  if(helpers.length === 0){  
  
    setTimeout(function(){  
  
      dotStartRescue(target);  
  
    },1000);  
  
    return;  
  
  }  
  
  
  target.rescuing = true;  
  
  
  helpers.forEach(function(helper){  
  
    helper.rescuing =  
      true;  
  
    helper.action =  
      "rescue";  
  
    helper.timer =  
      999999;  
  
    dotClearExtras(helper);  
  
  });  
  
  
  function updateRescue(){  
  
    if(!target.defeated){  
  
      helpers.forEach(function(helper){  
  
        helper.rescuing =  
          false;  
  
      });  
  
      return;  
  
    }  
  
  
    helpers.forEach(function(helper,index){  
  
      const side =  
        index === 0  
        ? -1  
        : 1;  
  
  
      const targetX =  
        target.x+side*5;  
  
  
      const targetY =  
        target.y;  
  
  
      const dx =  
        targetX-helper.x;  
  
      const dy =  
        targetY-helper.y;  
  
  
      const distance =  
        Math.sqrt(dx*dx+dy*dy);  
  
  
      if(distance > 1){  
  
        helper.x +=  
          dx/distance*0.15;  
  
        helper.y +=  
          dy/distance*0.15;  
  
      }  
  
  
      helper.wrapper.style.left =  
        helper.x+"vw";  
  
      helper.wrapper.style.top =  
        helper.y+"vh";  
  
    });  
  
  
    const ready =  
      helpers.every(function(helper){  
  
        return(  
          dotDistance(  
            helper,  
            target  
          ) < 7  
        );  
  
      });  
  
  
    if(ready){  
  
      helpers.forEach(function(helper){  
  
        dotAddHeart(helper);  
  
      });  
  
  
      setTimeout(function(){  
  
        dotReviveCharacter(target);  
  
  
        helpers.forEach(function(helper){  
  
          helper.rescuing =  
            false;  
  
          helper.action =  
            "idle";  
  
          helper.timer =  
            Math.floor(  
              dotRandom(120,300)  
            );  
  
          helper.img.className =  
            "dotHolo idle";  
  
        });  
  
      },1000);  
  
  
      return;  
  
    }  
  
  
    requestAnimationFrame(  
      updateRescue  
    );  
  
  }  
  
  
  updateRescue();  
  
}  
  
  
/* =====================================================  
   復活  
===================================================== */  
  
function dotReviveCharacter(character){  
  
  if(  
    !character ||  
    !character.defeated  
  ){  
    return;  
  }  
  
  
  character.defeated =  
    false;  
  
  character.rescuing =  
    false;  
  
  character.action =  
    "idle";  
  
  character.timer =  
    Math.floor(  
      dotRandom(120,300)  
    );  
  
  
  character.img.style.transform =  
    "";  
  
  character.img.style.transformOrigin =  
    "";  
  
  character.img.className =  
    "dotHolo idle";  
  
}  
  
  
/* =====================================================  
   ハート  
===================================================== */  
  
function dotAddHeart(character){  
  
  const heart =  
    document.createElement("div");  
  
  
  heart.textContent =  
    "💕";  
  
  
  heart.style.position =  
    "absolute";  
  
  heart.style.left =  
    "25px";  
  
  heart.style.top =  
    "-20px";  
  
  heart.style.fontSize =  
    "35px";  
  
  heart.style.zIndex =  
    "99999";  
  
  heart.style.pointerEvents =  
    "none";  
  
  
  character.wrapper.appendChild(  
    heart  
  );  
  
  
  let y =  
    -20;  
  
  
  function moveHeart(){  
  
    y -= 0.5;  
  
    heart.style.top =  
      y+"px";  
  
  
    if(y < -55){  
  
      heart.remove();  
  
      return;  
  
    }  
  
  
    requestAnimationFrame(  
      moveHeart  
    );  
  
  }  
  
  
  moveHeart();  
  
}  
  
  
/* =====================================================  
   ホロメン撃破  
===================================================== */  
  
function dotDefeatCharacter(character){  
  
  if(  
    !character ||  
    character.defeated  
  ){  
    return;  
  }  
  
  
  /*  
    すいせいの隕石処理などから  
    二重撃破を防止  
  */  
  
  character.rescuing =  
    false;  
  
  
  dotClearExtras(character);  
  
  
  character.defeated =  
    true;  
  
  
  character.action =  
    "defeated";  
  
  
  character.timer =  
    999999;  
  
  
  character.img.className =  
    "dotHolo defeated";  
  
  
  character.img.style.transform =  
    "rotate(90deg)";  
  
  
  character.img.style.transformOrigin =  
    "center bottom";  
  
  
  /*  
    AZKiの特殊処理用  
  */  
  
  dotAzkiCheck();  
  
  
  /*  
    全滅確認  
  */  
  
  dotCheckPartyDefeat();  
  
}

===================================================== */  
  
function dotSuiseiMeteor(character){

    character.name !== "星街すいせい" ||  
    character.suiseiUsed ||  
    !dotBossBattleActive()  
  ){

  }

  }

    "50%";  
  
  meteor.style.top =  
    "20%";  
  
  meteor.style.fontSize =  
    "100px";  
  
  meteor.style.zIndex =  
    "999999";  
  
  meteor.style.pointerEvents =  
    "none";  
  
  
  document.body.appendChild(  
    meteor  
  );  
  
  
  setTimeout(function(){  
  
    meteor.remove();  
  
  
    /*  
      84px範囲  
    */  
  
    const cx =  
      character.x;  
  
    const cy =  
      character.y;  
  
  
    dotCharacters.forEach(function(other){  
  
      if(  
        other === character ||  
        other.defeated  
      ){  
        return;  
      }  
  
  
      const px =  
        (other.x-cx)*  
        window.innerWidth/100;  
  
      const py =  
        (other.y-cy)*  
        window.innerHeight/100;  
  
  
      if(  
        Math.sqrt(px*px+py*py) <= 84  
      ){  
  
        dotDefeatCharacter(other);  
  
      }  
  
    });  
  
  
    dotActiveBosses.forEach(function(boss){  
  
      const px =  
        (boss.x-cx)*  
        window.innerWidth/100;  
  
      const py =  
        (boss.y-cy)*  
        window.innerHeight/100;  
  
  
      if(  
        Math.sqrt(px*px+py*py) <= 84  
      ){  
  
        dotDefeatSingleBoss(boss);  
  
      }  
  
    });  
  
  },700);  
  
}

/* =====================================================  
   マグマ処理  
===================================================== */  
  
function dotMagmaUpdate(){  
  
  dotCharacters.forEach(function(character){  
  
    if(!character.magma){  
      return;  
    }  
  
  
    character.magmaLife--;  
  
  
    dotActiveBosses.forEach(function(boss){  
  
      const dx =  
        (boss.x-character.magmaX)*  
        window.innerWidth/100;  
  
      const dy =  
        (boss.y-character.magmaY)*  
        window.innerHeight/100;  
  
  
      if(  
        Math.sqrt(dx*dx+dy*dy) < 50  
      ){  
  
        boss.speedMultiplier *= 0.995;  
  
        boss.hp -=  
          20/60;  
  
      }  
  
    });  
  
  
    dotCharacters.forEach(function(other){  
  
      if(other.defeated){  
        return;  
      }  
  
  
      const dx =  
        (other.x-character.magmaX)*  
        window.innerWidth/100;  
  
      const dy =  
        (other.y-character.magmaY)*  
        window.innerHeight/100;  
  
  
      if(  
        Math.sqrt(dx*dx+dy*dy) < 50  
      ){  
  
        /*  
          ホロメンも毎秒20ダメージ  
          ここでは簡易的に一定確率で撃破  
        */  
  
        if(Math.random() < 20/600){  
  
          dotDefeatCharacter(  
            other  
          );  
  
        }  
  
      }  
  
    });  
  
  
    if(character.magmaLife <= 0){  
  
      character.magma.remove();  
  
      character.magma =  
        null;  
  
    }  
  
  });  
  
}

/* =====================================================  
   AZKi  
===================================================== */  
  
function dotAzkiCheck(){  
  
  const azki =  
    dotCharacters.find(function(character){  
  
      return character.name === "azki";  
  
    });  
  
  
  if(  
    !azki ||  
    azki.defeated  
  ){  
    return;  
  }  
  
  
  /*  
    戦闘中に倒れた人数  
  */  
  
  const defeated =  
    dotCharacters.filter(function(character){  
  
      return character.defeated;  
  
    });  
  
  
  if(defeated.length === 0){  
    return;  
  }  
  
  
  /*  
    倒れた人数%  
  */  
  
  const reviveCount =  
    Math.floor(  
      dotCharacters.length *  
      defeated.length /  
      100  
    );  
  
  
  if(  
    reviveCount <= 0  
  ){  
    return;  
  }  
  
  
  const targets =  
    defeated  
      .filter(function(character){  
  
        return character !== azki;  
  
      })  
      .slice(0,reviveCount);  
  
  
  if(targets.length === 0){  
    return;  
  }  
  
  
  targets.forEach(function(target){  
  
    dotReviveCharacter(  
      target  
    );  
  
  });  
  
  
  dotDefeatCharacterDirect(  
    azki  
  );  
  
}

/* =====================================================  
   ボスから逃げる  
===================================================== */  
  
function dotRunAwayFromBoss(character){  
  
  const boss =  
    dotFindNearestBoss(character);  
  
  
  if(!boss){  
    return;  
  }  
  
  
  const dx =  
    character.x-boss.x;  
  
  const dy =  
    character.y-boss.y;  
  
  
  const distance =  
    Math.sqrt(dx*dx+dy*dy);  
  
  
  if(distance === 0){  
    return;  
  }  
  
  
  /*  
    ある程度近い時だけ逃げる  
  */  
  
  if(distance < 28){  
  
    const speed =  
      character.speed *  
      1.8;  
  
  
    character.x +=  
      dx/distance*speed;  
  
    character.y +=  
      dy/distance*speed;  
  
  
    character.action =  
      "run";  
  
  
    character.direction =  
      dx >= 0 ? 1 : -1;  
  
  
    character.img.className =  
      "dotHolo run";  
  
  }  
  
}  
  
  
/* =====================================================  
   銃撃  
===================================================== */  
  
function dotShootBoss(character){  
  
  if(  
    !dotBossBattleActive() ||  
    !character ||  
    character.defeated  
  ){  
    return;  
  }  
  
  
  const bullet =  
    document.createElement("div");  
  
  
  bullet.className =  
    "dotBullet";  
  
  
  bullet.textContent =  
    "•";  
  
  
  bullet.style.position =  
    "fixed";  
  
  bullet.style.zIndex =  
    "99999";  
  
  bullet.style.fontSize =  
    "24px";  
  
  bullet.style.fontWeight =  
    "bold";  
  
  bullet.style.pointerEvents =  
    "none";  
  
  
  document.body.appendChild(  
    bullet  
  );  
  
  
  const rect =  
    character.img.getBoundingClientRect();  
  
  
  let x =  
    rect.left+rect.width/2;  
  
  let y =  
    rect.top+rect.height/2;  
  
  
  const targetBoss =  
    dotFindNearestBoss(character);  
  
  
  if(!targetBoss){  
  
    bullet.remove();  
  
    return;  
  
  }  
  
  
  const bossRect =  
    targetBoss.img.getBoundingClientRect();  
  
  
  const targetX =  
    bossRect.left+  
    bossRect.width/2;  
  
  
  const targetY =  
    bossRect.top+  
    bossRect.height/2;  
  
  
  const dx =  
    targetX-x;  
  
  const dy =  
    targetY-y;  
  
  
  const distance =  
    Math.sqrt(dx*dx+dy*dy);  
  
  
  if(distance <= 0){  
  
    bullet.remove();  
  
    return;  
  
  }  
  
  
  const speed =  
    10;  
  
  
  const vx =  
    dx/distance*speed;  
  
  const vy =  
    dy/distance*speed;  
  
  
  /*  
    通常の飛距離  
  */  
  
  let travelled =  
    0;  
  
  
  const maxRange =  
    500;  
  
  
  /*  
    逃走中は命中率低下  
  */  
  
  const hitRate =  
    character.action === "run"  
    ? 0.55  
    : 0.90;  
  
  
  function moveBullet(){  
  
    if(  
      !dotBossBattleActive() ||  
      targetBoss.dead  
    ){  
  
      bullet.remove();  
  
      return;  
  
    }  
  
  
    x += vx;  
    y += vy;  
  
    travelled += speed;  
  
  
    bullet.style.left =  
      x+"px";  
  
    bullet.style.top =  
      y+"px";  
  
  
    const bossRectNow =  
      targetBoss.img.getBoundingClientRect();  
  
  
    const bossX =  
      bossRectNow.left+  
      bossRectNow.width/2;  
  
  
    const bossY =  
      bossRectNow.top+  
      bossRectNow.height/2;  
  
  
    const hitDistance =  
      Math.sqrt(  
        Math.pow(bossX-x,2)+  
        Math.pow(bossY-y,2)  
      );  
  
  
    if(  
      hitDistance <  
      Math.max(  
        35,  
        bossRectNow.width/2  
      )  
    ){  
  
      bullet.remove();  
  
  
      /*  
        命中率  
      */  
  
      if(Math.random() <= hitRate){  
  
        const damage =  
          10*  
          (character.attackMultiplier || 1);  
  
  
        targetBoss.hp -=  
          damage;  
  
  
        
  
  
        if(  
          targetBoss.hp <= 0  
        ){  
  
          dotDefeatSingleBoss(  
            targetBoss  
          );  
  
        }  
  
      }  
  
      return;  
  
    }  
  
  
    if(  
      travelled >= maxRange ||  
      x < -100 ||  
      x > window.innerWidth+100 ||  
      y < -100 ||  
      y > window.innerHeight+100  
    ){  
  
      bullet.remove();  
  
      return;  
  
    }  
  
  
    requestAnimationFrame(  
      moveBullet  
    );  
  
  }  
  
  
  moveBullet();  
  
}  
  
  
/* =====================================================  
   キャラクター行動選択  
===================================================== */  
  
function dotChooseAction(character){  
  
  if(character.defeated){  
  
    character.action =  
      "defeated";  
  
    return;  
  
  }  
  
  
  if(character.rescuing){  
  
    character.action =  
      "rescue";  
  
    return;  
  
  }  
  
  
  /*  
    ボス戦  
  */  
  
  if(dotBossBattleActive()){  
  
    character.action =  
      "shoot";  
  
    character.timer =  
      999999;  
  
    character.img.className =  
      "dotHolo shoot";  
  
    return;  
  
  }  
  
  
  dotClearExtras(character);  
  
  
  if(character.chasing){  
  
    character.action =  
      "chase";  
  
    character.timer =  
      999999;  
  
    character.img.className =  
      "dotHolo run";  
  
    return;  
  
  }  
  
  
  const action =  
    dotActions[  
      Math.floor(  
        Math.random()*  
        dotActions.length  
      )  
    ];  
  
  
  character.action =  
    action;  
  
  
  character.timer =  
    Math.floor(  
      dotRandom(120,420)  
    );  
  
  
  character.img.className =  
    "dotHolo "+action;  
  
  
  if(action === "walk"){  
  
    character.direction =  
      Math.random()<0.5  
      ? -1  
      : 1;  
  
  }  
  
  
  if(action === "eat"){  
  
    dotAddFood(character);  
  
  }  
  
  
  if(action === "cry"){  
  
    dotAddTears(character);  
  
  }  
  
  
  if(action === "sleep"){  
  
    dotAddSleep(character);  
  
  }  
  
}  
  
  
/* =====================================================  
   キャラクター更新  
===================================================== */  
  
function dotUpdate(character){  
  
  if(character.defeated){  
  
    requestAnimationFrame(function(){  
  
      dotUpdate(character);  
  
    });  
  
    return;  
  
  }  
  
  
  if(character.rescuing){  
  
    requestAnimationFrame(function(){  
  
      dotUpdate(character);  
  
    });  
  
    return;  
  
  }  
  
  
  /*  
    ボス戦  
  */  
  
  if(dotBossBattleActive()){  
  
    /*  
      ボスから逃げる  
    */  
  
    dotRunAwayFromBoss(character);  
  
  
    /*  
      すいせい接触能力  
    */  
  
    if(  
      character.name === "星街すいせい"  
    ){  
  
      dotSuiseiMeteor(character);  
  
    }  
  
  
    /*  
      みこマグマ  
    */  
  
    if(  
      character.name === "さくらみこ"  
    ){  
  
      character.magmaCooldown--;  
  
      if(  
        character.magmaCooldown <= 0 &&  
        Math.random() < 0.002  
      ){  
  
        dotCreateMagma(character);  
  
        character.magmaCooldown =  
          300;  
  
      }  
  
    }  
  
  
    /*  
      ロボ子接触  
    */  
  
    if(  
      character.name === "ロボ子さん"  
    ){  
  
      dotRoboTouch();  
  
    }  
  
  
    /*  
      射撃  
    */  
  
    character.shootCooldown--;  
  
  
    if(  
      character.shootCooldown <= 0  
    ){  
  
      dotShootBoss(  
        character  
      );  
  
  
      character.shootCooldown =  
        Math.floor(  
          dotRandom(12,35)  
        );  
  
    }  
  
  
    /*  
      ボス戦中も位置を動かす  
    */  
  
    character.x =  
      Math.max(  
        2,  
        Math.min(  
          94,  
          character.x  
        )  
      );  
  
  
    character.y =  
      Math.max(  
        10,  
        Math.min(  
          88,  
          character.y  
        )  
      );  
  
  
    character.wrapper.style.left =  
      character.x+"vw";  
  
  
    character.wrapper.style.top =  
      character.y+"vh";  
  
  
    dotCharacterCollision(  
      character  
    );  
  
  
    requestAnimationFrame(function(){  
  
      dotUpdate(character);  
  
    });  
  
    return;  
  
  }  
  
  
  /*  
    追いかけっこ  
  */  
  
  if(  
    character.action === "chase" &&  
    character.chaseTarget &&  
    !character.chaseTarget.defeated  
  ){  
  
    const target =  
      character.chaseTarget;  
  
  
    const dx =  
      target.x-character.x;  
  
    const dy =  
      target.y-character.y;  
  
  
    const distance =  
      Math.sqrt(dx*dx+dy*dy);  
  
  
    if(distance > 2){  
  
      character.x +=  
        dx/distance*  
        character.speed*  
        1.5;  
  
      character.y +=  
        dy/distance*  
        character.speed*  
        1.5;  
  
    }  
  
  }  
  
  
  character.timer--;  
  
  
  if(  
    character.action === "walk" ||  
    character.action === "run"  
  ){  
  
    character.x +=  
      character.speed*  
      character.direction*  
      (  
        character.action === "run"  
        ? 2  
        : 1  
      );  
  
  
    if(character.x > 94){  
  
      character.x =  
        94;  
  
      character.direction =  
        -1;  
  
    }  
  
  
    if(character.x < 2){  
  
      character.x =  
        2;  
  
      character.direction =  
        1;  
  
    }  
  
  }  
  
  
  if(  
    character.action === "jump"  
  ){  
  
    character.y +=  
      Math.sin(  
        character.timer/60*  
        Math.PI*2  
      )*0.08;  
  
  }  
  
  
  if(  
    character.timer <= 0  
  ){  
  
    character.chasing =  
      false;  
  
    character.chaseTarget =  
      null;  
  
    dotChooseAction(  
      character  
    );  
  
  }  
  
  
  character.x =  
    Math.max(  
      2,  
      Math.min(  
        94,  
        character.x  
      )  
    );  
  
  
  character.y =  
    Math.max(  
      10,  
      Math.min(  
        88,  
        character.y  
      )  
    );  
  
  
  character.wrapper.style.left =  
    character.x+"vw";  
  
  
  character.wrapper.style.top =  
    character.y+"vh";  
  
  
  dotCharacterCollision(  
    character  
  );  
  
  
  if(  
    character.action === "explode" &&  
    !character.explosion  
  ){  
  
    dotAddExplosion(  
      character  
    );  
  
  }  
  
  
  if(  
    character.action === "heal" &&  
    !character.healEffect  
  ){  
  
    dotAddHeal(  
      character  
    );  
  
  }  
  
  
  if(  
    character.action === "soccer" &&  
    !character.ball  
  ){  
  
    dotAddSoccer(  
      character  
    );  
  
  }  
  
  
  requestAnimationFrame(function(){  
  
    dotUpdate(character);  
  
  });  
  
}  
  
  
/* =====================================================  
   ホロメン同士の衝突  
===================================================== */  
  
function dotCharacterCollision(character){  
  
  if(character.defeated){  
    return;  
  }  
  
  
  dotCharacters.forEach(function(other){  
  
    if(  
      other === character ||  
      other.defeated  
    ){  
      return;  
    }  
  
  
    const dx =  
      other.x-character.x;  
  
    const dy =  
      other.y-character.y;  
  
  
    const distance =  
      Math.sqrt(dx*dx+dy*dy);  
  
  
    const minDistance =  
      6;  
  
  
    if(  
      distance >= minDistance  
    ){  
      return;  
    }  
  
  
    if(distance === 0){  
  
      other.x += 0.02;  
  
      return;  
  
    }  
  
  
    const overlap =  
      minDistance-distance;  
  
  
    const nx =  
      dx/distance;  
  
    const ny =  
      dy/distance;  
  
  
    const push =  
      Math.min(  
        overlap*0.18,  
        0.12  
      );  
  
  
    character.x -=  
      nx*push;  
  
    character.y -=  
      ny*push;  
  
    other.x +=  
      nx*push;  
  
    other.y +=  
      ny*push;  
  
  
    const characterMoving =  
      character.action === "walk" ||  
      character.action === "run";  
  
  
    const otherMoving =  
      other.action === "walk" ||  
      other.action === "run";  
  
  
    if(  
      characterMoving &&  
      !otherMoving  
    ){  
  
      other.x +=  
        character.direction*  
        0.025;  
  
    }  
    else if(  
      !characterMoving &&  
      otherMoving  
    ){  
  
      character.x +=  
        other.direction*  
        0.025;  
  
    }  
    else if(  
      characterMoving &&  
      otherMoving  
    ){  
  
      if(  
        character.speed >  
        other.speed  
      ){  
  
        other.x +=  
          character.direction*  
          0.02;  
  
      }  
      else{  
  
        character.x +=  
          other.direction*  
          0.02;  
  
      }  
  
    }  
  
  
    /*  
      星街すいせい  
      ボス戦中の接触  
    */  
  
    if(  
      dotBossBattleActive() &&  
      character.name === "星街すいせい"  
    ){  
  
      dotSuiseiMeteor(  
        character  
      );  
  
    }  
  
  
    if(  
      dotBossBattleActive() &&  
      other.name === "星街すいせい"  
    ){  
  
      dotSuiseiMeteor(  
        other  
      );  
  
    }  
  
  });  
  
  
  character.x =  
    Math.max(  
      2,  
      Math.min(  
        94,  
        character.x  
      )  
    );  
  
  
  character.y =  
    Math.max(  
      10,  
      Math.min(  
        88,  
        character.y  
      )  
    );  
  
}

/* =====================================================  
   追いかけっこ  
===================================================== */  
  
function dotStartChase(){  
  
  if(dotBossBattleActive()){  
    return;  
  }  
  
  
  const available =  
    dotCharacters.filter(function(character){  
  
      return(  
        !character.defeated &&  
        !character.rescuing &&  
        !character.chasing  
      );  
  
    });  
  
  
  if(available.length < 2){  
    return;  
  }  
  
  
  const count =  
    Math.min(  
      available.length,  
      Math.floor(  
        dotRandom(2,5)  
      )  
    );  
  
  
  const shuffled =  
    shuffleArray(  
      available  
    );  
  
  
  const group =  
    shuffled.slice(  
      0,  
      count  
    );  
  
  
  group.forEach(function(character,index){  
  
    character.chasing =  
      true;  
  
    character.action =  
      "chase";  
  
    character.timer =  
      999999;  
  
    character.img.className =  
      "dotHolo run";  
  
  
    character.chaseTarget =  
      group[  
        (index+1)%  
        group.length  
      ];  
  
  });  
  
  
  setTimeout(function(){  
  
    group.forEach(function(character){  
  
      if(  
        !character.defeated &&  
        !character.rescuing  
      ){  
  
        character.chasing =  
          false;  
  
        character.chaseTarget =  
          null;  
  
        character.action =  
          "idle";  
  
        character.timer =  
          Math.floor(  
            dotRandom(120,300)  
          );  
  
        character.img.className =  
          "dotHolo idle";  
  
      }  
  
    });  
  
  },  
  Math.floor(  
    dotRandom(3000,8000)  
  ));  
  
}  
  
  
/* =====================================================  
   追いかけっこシステム  
===================================================== */  
  
function dotChaseSystem(){  
  
  if(!dotBossBattleActive()){  
  
    dotChaseTimer--;  
  
  
    if(dotChaseTimer <= 0){

}

/* =====================================================  
   次の15人  
===================================================== */

  /*  
    現在のキャラクターを消す  
  */  
  
  dotCharacters.forEach(function(character){  
  
    if(character.wrapper){  
      character.wrapper.remove();  
    }  
  
  });  
  
  
  dotCharacters.length =  
    0;  
  
  
  /*  
    残りがなければ  
    ボス徘徊状態  
  */  
  
  if(dotAvailableMembers.length === 0){  
  
    dotBossTimer =  
      999999;  
  
    return;  
  
  }  
  
  
  /*  
    最大15人  
  */  
  
  const group =  
    dotAvailableMembers.splice(  
      0,  
      Math.min(  
        15,  
        dotAvailableMembers.length  
      )  
    );  
  
  
  dotCurrentGroup =  
    group;  
  
  
  dotGroupNumber++;  
  
  
  dotResetSpecialAbilities();  
  
  
  group.forEach(function(member,index){  
  
    createDotHolo(  
      member,  
      index  
    );  
  
  });  
  
}  
  
  
/* =====================================================  
   シャッフル  
===================================================== */  
  
function shuffleArray(array){  
  
  const a =  
    [...array];  
  
  
  for(  
    let i=a.length-1;  
    i>0;  
    i--  
  ){  
  
    const j =  
      Math.floor(  
        Math.random()*(i+1)  
      );  
  
  
    [  
      a[i],  
      a[j]  
    ] =  
    [  
      a[j],  
      a[i]  
    ];  
  
  }  
  
  
  return a;  
  
}  
  
  
/* =====================================================  
   キャラクター作成  
===================================================== */  
  
function createDotHolo(  
  data,  
  index  
){  
  
  const wrapper =  
    document.createElement("div");  
  
  
  wrapper.style.position =  
    "absolute";  
  
  
  wrapper.style.left =  
    dotRandom(5,90)+"vw";  
  
  
  wrapper.style.top =  
    dotRandom(15,85)+"vh";  
  
  
  const img =  
    document.createElement("img");  
  
  
  img.className =  
    "dotHolo idle";  
  
  
  img.src =  
    "ドットホロメン/"+data.image;  
  
  
  img.alt =  
    data.name;  
  
  
  img.draggable =  
    false;  
  
  
  wrapper.appendChild(  
    img  
  );  
  
  
  dotHoloWorld.appendChild(  
    wrapper  
  );  
  
  
  const character = {  
  
    wrapper:wrapper,  
  
    img:img,  
  
    name:data.name,  
  
    x:parseFloat(  
      wrapper.style.left  
    ),  
  
    y:parseFloat(  
      wrapper.style.top  
    ),  
  
    action:"idle",  
  
    direction:  
      Math.random()<0.5  
      ? -1  
      : 1,  
  
    speed:  
      dotRandom(  
        .015,  
        .05  
      ),  
  
    timer:0,  
  
    index:index,  
  
    defeated:false,  
  
    rescuing:false,  
  
    chasing:false,  
  
    chaseTarget:null,  
  
    bullet:null,  
  
    explosion:null,  
  
    healEffect:null,  
  
    ball:null,  
  
    food:null,  
  
    tears:null,  
  
    sleepMark:null,  
  
    magma:null,  
  
    magmaX:0,  
  
    magmaY:0,  
  
    magmaLife:0,  
  
    magmaCooldown:0,  
  
    shootCooldown:  
      Math.floor(  
        dotRandom(10,40)  
      ),  
  
    attackMultiplier:1,  
  
    soraGuardUsed:false,  
  
    suiseiUsed:false,  
  
    roboBuffUsed:false  
  
  };  
  
  
  dotCharacters.push(  
    character  
  );  
  
  
  dotChooseAction(  
    character  
  );  
  
  
  requestAnimationFrame(function(){  
  
    dotUpdate(  
      character  
    );  
  
  });  
  
}  
  
  
/* =====================================================
   ボスシステム
===================================================== */


function dotBossSystem(){


  /*
    ボスがいない時だけ
    毎フレームランダムで出現判定
  */


  if(
    !dotBossBattleActive()
  ){


    /*
      約1秒に1回くらいの感覚で
      「ボスを出すか」を判定する


      0.0007 = かなり低確率
      → 出現タイミングは毎回ランダム
    */


    if(
      Math.random() < 0.0007
    ){


      dotSpawnBoss();


    }


  }




  /*
    ボスを全員動かす
  */


  dotBossUpdate();




  /*
    HPが0になったボスを処理
  */


  [...dotActiveBosses].forEach(
    function(boss){


      if(
        !boss.dead &&
        boss.hp <= 0
      ){


        dotDefeatSingleBoss(
          boss
        );


      }


    }
  );




  requestAnimationFrame(
    dotBossSystem
  );


}  
  
/* =====================================================  
   最初の15人  
===================================================== */  
  
dotAvailableMembers =  
  shuffleArray(  
    dotHolomembers  
  );  
  
  
const firstGroup =  
  dotAvailableMembers.splice(  
    0,  
    Math.min(  
      15,  
      dotAvailableMembers.length  
    )  
  );  
  
  
dotCurrentGroup =  
  firstGroup;  
  
  
firstGroup.forEach(function(member,index){  
  
  createDotHolo(  
    member,  
    index  
  );  
  
});  
  
  
/* =====================================================  
   システム開始  
===================================================== */  
  
dotBossSystem();  
  
dotChaseSystem();  
  
dotMagmaSystem();
